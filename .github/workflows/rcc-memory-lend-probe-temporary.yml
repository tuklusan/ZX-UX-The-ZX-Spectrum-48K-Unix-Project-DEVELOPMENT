name: Temporary Chess and 3D Paint memory lending probe
on:
  push:
    paths:
      - '.github/workflows/rcc-memory-lend-probe-temporary.yml'
permissions:
  contents: read
jobs:
  memory-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Probe real ZX-UX memory lending
        timeout-minutes: 6
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,sys,hashlib
          root=Path.cwd()
          sys.path.insert(0,str((root/'dist/sdk/bin/py').resolve()))
          import zxux,rld
          window=0xF000; top=0xFFB9
          for name in ('chess','3dpaint'):
           path=root/'dist/assets/c48-bin/ssx'/f'{name}.ssx'
           binary=path.read_bytes()
           h=rld.parse_ssx(binary)
           s=zxux.Session(cache=True)
           s.boot()
           before={'a_top':s.word(0x5BE0),'wlend':s.word(0x5BE2)}
           trace=[]
           last=[None]
           def watch(frame):
            state=(s.word(0x5BE0),s.word(0x5BE2))
            if state!=last[0]:
             trace.append({'frame':s.m.frame,'a_top':state[0],'wlend':state[1]})
             last[0]=state
           s.frame_hooks.append(watch)
           job=s.launch(binary,name,(),False)
           s.run_until(lambda:job.started is not None or job.ended is not None,4500,name+' started or ended')
           started=job.started is not None
           state_at_start={'a_top':s.word(0x5BE0),'wlend':s.word(0x5BE2)}
           if started:
            for _ in range(90): s.step()
           post={'a_top':s.word(0x5BE0),'wlend':s.word(0x5BE2)}
           # A nonzero wlend records a program using the shared window as arena.
           seen_lend=any(t['wlend']!=0 for t in trace)
           observation={'program':name,'ssx_sha256':hashlib.sha256(binary).hexdigest(),'file':len(binary),
            'image':len(h['image']),'bss':h['bss'],'stack':h['stack'],
            'total':len(h['image'])+h['bss']+h['stack'],
            'started':started,'ended':job.ended is not None,'status':job.status,
            'initial':before,'at_start':state_at_start,'after_90_frames':post,
            'lend_detected':seen_lend,'transitions':trace[:25]}
           print('MEMORY_PROBE',json.dumps(observation,sort_keys=True),flush=True)
           assert started and job.ended is None, name+' did not remain running'
           assert before['a_top']==window and before['wlend']==0, 'unexpected initial memory state'
           assert post['a_top'] in (window,top), 'unexpected arena extent'
           assert seen_lend == (post['wlend']!=0), 'inconsistent lending state'
          PY
