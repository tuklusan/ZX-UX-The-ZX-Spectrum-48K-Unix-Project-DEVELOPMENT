name: Beta offline baseline regression
on:
  push:
    paths:
      - 'release/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/regression.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zxux-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline-build-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checked assembler for CI
        run: |
          git clone --depth 1 --branch v1.24.0 --recurse-submodules --shallow-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus
          make -C /tmp/sjasmplus -j"$(nproc)"
          /tmp/sjasmplus/sjasmplus --version
      - name: Offline candidate build (no downloads inside builder)
        run: python3 release/build/build.py --sjasm /tmp/sjasmplus/sjasmplus
      - name: Distributed C48 source and output layout
        run: python3 -m unittest -v tests.release_independence_checks tests.test_beta8_source_layout
      - name: Independently checked SkoolKit 10.1 test harness
        run: python3 -m pip install skoolkit==10.1 pillow
      - name: Four fresh source and boot regression batches
        run: |
          python3 tests/run_migrated_baseline.py --tap2sna "$(command -v tap2sna.py)" --skoolkit "$(python3 -c 'import os,skoolkit; print(os.path.dirname(os.path.dirname(skoolkit.__file__)))')" --only "$(python3 -c 'import pathlib,re; t=pathlib.Path("tests/suite.py").read_text(); print(",".join(re.findall(r"@test\s*\ndef (\w+)\(",t)[:12]))')"
          python3 tests/run_migrated_baseline.py --tap2sna "$(command -v tap2sna.py)" --skoolkit "$(python3 -c 'import os,skoolkit; print(os.path.dirname(os.path.dirname(skoolkit.__file__)))')" --only "$(python3 -c 'import pathlib,re; t=pathlib.Path("tests/suite.py").read_text(); print(",".join(re.findall(r"@test\s*\ndef (\w+)\(",t)[12:24]))')"
          python3 tests/run_migrated_baseline.py --tap2sna "$(command -v tap2sna.py)" --skoolkit "$(python3 -c 'import os,skoolkit; print(os.path.dirname(os.path.dirname(skoolkit.__file__)))')" --only "$(python3 -c 'import pathlib,re; t=pathlib.Path("tests/suite.py").read_text(); print(",".join(re.findall(r"@test\s*\ndef (\w+)\(",t)[24:36]))')"
          python3 tests/run_migrated_baseline.py --tap2sna "$(command -v tap2sna.py)" --skoolkit "$(python3 -c 'import os,skoolkit; print(os.path.dirname(os.path.dirname(skoolkit.__file__)))')" --only "$(python3 -c 'import pathlib,re; t=pathlib.Path("tests/suite.py").read_text(); print(",".join(re.findall(r"@test\s*\ndef (\w+)\(",t)[36:]))')"
