name: ZX-UX one-time beta tag

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tag-beta-once.yml

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Tag the verified distribution baseline
        run: bash build/tools/tag-beta-once.sh beta-0.3.3 3c2257326ca20b242438d05a0c049bfb156f0c97
