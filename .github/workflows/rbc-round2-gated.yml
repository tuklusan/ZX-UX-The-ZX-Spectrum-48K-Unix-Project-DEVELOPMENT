name: RBC thin pyhsb gated verification
on:
  push:
    paths:
      - '.github/workflows/rbc-round2-gated.yml'
      - 'experiments/hisoft-rbc-2026-10-22/stage/**'
      - 'experiments/hisoft-rbc-2026-10-22/tests/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rbc-round2-gates-${{ github.ref }}
  cancel-in-progress: false
jobs:
  input-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage 0 — untouched 120 originals and empty outcomes
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py source

  compiler-setup:
    needs: input-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore preserved compiler without changing original source
        run: |
          mkdir -p build/tmp/rbc-round2/checkpoint
          git show c3d270375af56768df3af6f5ceb38f83c9bd5bdd:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > build/tmp/rbc-round2/checkpoint.zip
          unzip -oq build/tmp/rbc-round2/checkpoint.zip -d build/tmp/rbc-round2/checkpoint
          mkdir -p build/tmp/rbc-round2/current
          cp -R build/tmp/rbc-round2/checkpoint/scratch/rbc build/tmp/rbc-round2/current/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py build/tmp/rbc-round2/current experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py build/tmp/rbc-round2/current experiments/hisoft-rbc-2026-10-22/stage
          python3 -m compileall -q build/tmp/rbc-round2/current/rbc
      - name: Stage 0b — enforce sole pyhsb compiler core
        env:
          PYTHONPATH: build/tmp/rbc-round2/current/rbc
        run: python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_thin_wrapper.py' -v
      - name: Fetch exact frozen compiler dependencies
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git build/tmp/rbc-round2/upstream
          git -C build/tmp/rbc-round2/upstream checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          curl -fsSL --retry 2 --max-time 25 -o build/tmp/rbc-round2/hisoft48.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          test -s build/tmp/rbc-round2/hisoft48.tap
      - uses: actions/upload-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2/
          retention-days: 2

  val-and-usr:
    needs: compiler-setup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 1 — all VAL forms and machine-code-call ban
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py val

  system-variables:
    needs: val-and-usr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 2 — FLAGS2, PIP, FRAMES and isolation
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py sysvars

  for-next:
    needs: system-variables
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 3 — dynamic FOR/NEXT runtime behavior
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py loops

  strict-bas-tzx:
    needs: for-next
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 4 — original ROM syntax and dual-source fidelity
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py fidelity

  private-font:
    needs: strict-bas-tzx
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 5 — process-only font and reliable restoration
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py fonts

  native-memory:
    needs: private-font
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 6 — exact native requirement and 11000-byte default
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py memory

  focused-regressions:
    needs: native-memory
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 7 — entire focused RBC regression suite
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc
        run: python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -v

  native-link:
    needs: focused-regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 8 — real native linker and loader format
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream
        run: |
          printf '10 PRINT "HELLO"\n' > build/tmp/rbc-round2/hello.bas
          python3 build/tmp/rbc-round2/current/rbc/rbc.py build/tmp/rbc-round2/hello.bas --frontend build/tmp/rbc-round2/upstream --sdk src/zx-ux-sdk --rom src/zx-ux-sdk/rom/48.rom --tape build/tmp/rbc-round2/hisoft48.tap -o build/tmp/rbc-round2/hello.ssx --report build/tmp/rbc-round2/hello.json
          PYTHONPATH=src/zx-ux-sdk python3 - <<'PY'
          from pathlib import Path
          import rld
          output = Path('build/tmp/rbc-round2/hello.ssx').read_bytes()
          rld.parse_ssx(output)
          assert output.startswith(b'SSX1')
          PY

  private-checker:
    needs: native-link
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Stage 9 — unchanged private checker, required before any corpus work
        env:
          RBC_CHECKER_ZIP_B64: ${{ secrets.RBC_ROUND2_CHECKER_B64 }}
          RBC_CHECKER_SHA256: ${{ secrets.RBC_ROUND2_CHECKER_SHA256 }}
        run: |
          test -n "$RBC_CHECKER_ZIP_B64"
          test -n "$RBC_CHECKER_SHA256"
          mkdir -m 700 /tmp/rbc-round2-checker
          printf '%s' "$RBC_CHECKER_ZIP_B64" | base64 -d > /tmp/rbc-round2-checker/checker.zip
          printf '%s  %s\n' "$RBC_CHECKER_SHA256" /tmp/rbc-round2-checker/checker.zip | sha256sum -c -
          unzip -oq /tmp/rbc-round2-checker/checker.zip -d /tmp/rbc-round2-checker
          python3 /tmp/rbc-round2-checker/checker.py self-test
          git log -1 --pretty=%B > /tmp/rbc-round2-checker/message.txt
          python3 /tmp/rbc-round2-checker/checker_workflow.py check --tree experiments/hisoft-rbc-2026-10-22 --message-file /tmp/rbc-round2-checker/message.txt --command 'git push origin HEAD:refs/heads/main'

  revision-locked-corpus:
    needs: private-checker
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-frozen-toolchain
          path: build/tmp/rbc-round2
      - name: Stage 10 — independently attempt every BAS and every TZX
        env:
          PYTHONPATH: build/tmp/rbc-round2/upstream:build/tmp/rbc-round2/current/rbc:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/round2_runner.py --root "$GITHUB_WORKSPACE" --compiler "$GITHUB_WORKSPACE/build/tmp/rbc-round2/current/rbc/rbc.py" --frontend "$GITHUB_WORKSPACE/build/tmp/rbc-round2/upstream" --tape "$GITHUB_WORKSPACE/build/tmp/rbc-round2/hisoft48.tap" --workspace "$GITHUB_WORKSPACE/build/tmp/rbc-round2" --revision "$GITHUB_SHA"
      - name: Stage 11 — require all 120 outcomes and 60 byte comparisons
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py corpus
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-round2-120-unpublished-outcomes
          path: build/tmp/rbc-round2/
          retention-days: 2

  corpus-review:
    needs: revision-locked-corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-120-unpublished-outcomes
          path: build/tmp/rbc-round2
      - name: Stage 12 — independently recheck all result files
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py corpus

  publish-outcomes:
    needs: corpus-review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      published_sha: ${{ steps.push.outputs.published_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: rbc-round2-120-unpublished-outcomes
          path: build/tmp/rbc-round2
      - name: Stage 13 — verify exact 60 result files before writing
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py corpus
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --quiet
          python3 - <<'PY'
          import pathlib, shutil
          root = pathlib.Path('src/bonus/60-programs')
          candidate = pathlib.Path('build/tmp/rbc-round2/published')
          proposals = sorted(candidate.glob('*/bin/*'))
          assert len(proposals) == 60
          for f in proposals:
              target = root / f.relative_to(candidate)
              target.parent.mkdir(parents=True, exist_ok=True)
              assert not list(target.parent.iterdir()), f'{target.parent}: unexpected old outcome'
              shutil.copyfile(f, target)
          PY
          git add src/bonus/60-programs
          test "$(git diff --cached --name-only | wc -l)" -eq 60
      - name: Require unchanged private checker on staged files and commit text
        env:
          RBC_CHECKER_ZIP_B64: ${{ secrets.RBC_ROUND2_CHECKER_B64 }}
          RBC_CHECKER_SHA256: ${{ secrets.RBC_ROUND2_CHECKER_SHA256 }}
        run: |
          test -n "$RBC_CHECKER_ZIP_B64"
          test -n "$RBC_CHECKER_SHA256"
          mkdir -m 700 /tmp/rbc-round2-checker
          printf '%s' "$RBC_CHECKER_ZIP_B64" | base64 -d > /tmp/rbc-round2-checker/checker.zip
          printf '%s  %s\n' "$RBC_CHECKER_SHA256" /tmp/rbc-round2-checker/checker.zip | sha256sum -c -
          unzip -oq /tmp/rbc-round2-checker/checker.zip -d /tmp/rbc-round2-checker
          printf 'Publish verified dual-source RBC Round 2 outcomes\n' > /tmp/rbc-round2-checker/message.txt
          python3 /tmp/rbc-round2-checker/checker_workflow.py check --tree src/bonus/60-programs --message-file /tmp/rbc-round2-checker/message.txt --command 'git push origin HEAD:refs/heads/main'
      - name: Fast-forward outcome commit
        id: push
        run: |
          git config user.name 'ZX-UX RBC gates'
          git config user.email 'tuklusan@users.noreply.github.com'
          git commit -m 'Publish verified dual-source RBC Round 2 outcomes'
          git push origin HEAD:refs/heads/main
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  remote-readback:
    needs: publish-outcomes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage 14 — confirm remote results and protected original blobs
        env:
          VERIFIED_SHA: ${{ needs.publish-outcomes.outputs.published_sha }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$VERIFIED_SHA"
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          base='a464aa0ea5604aa392b5383fbc82f84d98fe96e1'
          remote='origin/main'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          old=dict(line.split(' ', 1) for line in git('ls-tree', '-r', '--format=%(objectname) %(path)',base).splitlines())
          new=dict(line.split(' ', 1) for line in git('ls-tree', '-r', '--format=%(objectname) %(path)',remote).splitlines())
          protected=lambda p: p.startswith(('src/zx-ux/', 'src/zx-ux-sdk/', 'dist/', 'release/')) or (p.startswith('src/bonus/60-programs/') and '/BASIC/' in p and p.endswith(('.bas','.tzx')))
          assert all(new.get(p)==v for p,v in old.items() if protected(p))
          bins=[p for p in new if p.startswith('src/bonus/60-programs/') and '/bin/' in p]
          assert len(bins)==60 and len({p.split('/')[3] for p in bins})==60
          assert all(p.endswith(('.ssx', '/README.md')) for p in bins)
          PY

  cleanup-rbc-workflow:
    needs: remote-readback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Stage 15 — delete only the temporary RBC workflow
        env:
          RBC_CHECKER_ZIP_B64: ${{ secrets.RBC_ROUND2_CHECKER_B64 }}
          RBC_CHECKER_SHA256: ${{ secrets.RBC_ROUND2_CHECKER_SHA256 }}
        run: |
          git fetch origin main
          git checkout -B rbc-completion origin/main
          test "$(find .github/workflows -maxdepth 1 -type f | wc -l)" -eq 1
          test -f .github/workflows/rbc-round2-gated.yml
          git rm .github/workflows/rbc-round2-gated.yml
          mkdir -m 700 /tmp/rbc-round2-checker
          printf '%s' "$RBC_CHECKER_ZIP_B64" | base64 -d > /tmp/rbc-round2-checker/checker.zip
          printf '%s  %s\n' "$RBC_CHECKER_SHA256" /tmp/rbc-round2-checker/checker.zip | sha256sum -c -
          unzip -oq /tmp/rbc-round2-checker/checker.zip -d /tmp/rbc-round2-checker
          printf 'Remove temporary RBC workflow after verified publication\n' > /tmp/rbc-round2-checker/message.txt
          python3 /tmp/rbc-round2-checker/checker_workflow.py check --path .github/workflows/rbc-round2-gated.yml --message-file /tmp/rbc-round2-checker/message.txt --command 'git push origin HEAD:refs/heads/main'
          git config user.name 'ZX-UX RBC gates'
          git config user.email 'tuklusan@users.noreply.github.com'
          git commit -m 'Remove temporary RBC workflow after verified publication'
          git push origin HEAD:refs/heads/main
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)"
          test -z "$(git ls-tree -r --name-only HEAD .github/workflows)"
