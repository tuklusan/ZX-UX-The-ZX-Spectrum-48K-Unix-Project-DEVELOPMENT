name: RBC diagnostic integration verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rbc-diagnostics-temporary.yml'
      - 'experiments/hisoft-rbc-2026-10-22/stage/**'
      - 'experiments/hisoft-rbc-2026-10-22/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused unit tests and source format checks
        shell: bash
        run: |
          set -euo pipefail
          root=experiments/hisoft-rbc-2026-10-22
          for pattern in test_diagnostics.py test_basic_listing.py test_rbc_fit.py test_native_memory_failure.py test_result_classify.py test_rom_syntax.py; do
            PYTHONPATH="$root/stage:src/zx-ux-sdk" python -m unittest discover -s "$root/tests" -p "$pattern" -v
          done
          python -m compileall -q "$root/stage"
      - uses: actions/checkout@v4
        with:
          repository: imneme/pyhsb
          ref: 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          path: build/tmp/rbc-diagnostics/upstream
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT
          ref: f12650495d81df52a1835a71bef878be6a569e30
          path: build/tmp/rbc-diagnostics/checkpoint-ref
          persist-credentials: false
      - name: Prepare unchanged HiSoft frontend with unified formatter
        shell: bash
        run: |
          set -euo pipefail
          base=build/tmp/rbc-diagnostics
          stage=experiments/hisoft-rbc-2026-10-22/stage
          cpdir="$base/checkpoint-ref/experiments/hisoft-rbc-2026-10-22/temporary-checkpoint"
          mkdir -p "$base/current/rbc"
          cp "$cpdir/rbc.py" "$base/current/rbc/rbc.py"
          cp "$cpdir/memory_safety.py" "$base/current/rbc/memory_safety.py"
          base64 -d "$cpdir/font32.b64" > "$base/current/rbc/font32.bin"
          python "$stage/prepare_rbc.py" "$base/current" "$stage"
          python "$stage/finish_rbc.py" "$base/current" "$stage"
          mkdir -p build/tmp/rbc-round2
          ln -s ../rbc-diagnostics/current build/tmp/rbc-round2/current
          PYTHONPATH="$base/upstream" python -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_thin_wrapper.py' -v
          python -m py_compile "$base/current/rbc/rbc.py"
          curl -fsSL --retry 2 --max-time 30 -o "$base/hisoft48.tap" https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          PYTHONPATH="$base/upstream:$base/current/rbc:src/zx-ux-sdk" python - <<'PY'
          import subprocess, sys
          from pathlib import Path
          import rld
          base=Path('build/tmp/rbc-diagnostics')
          compiler=base/'current/rbc/rbc.py'
          env=[sys.executable,str(compiler)]
          common=['--frontend',str(base/'upstream'),'--sdk','src/zx-ux-sdk',
                  '--rom','src/zx-ux-sdk/rom/48.rom','--tape',str(base/'hisoft48.tap')]
          source=base/'valid.bas'
          source.write_text('10 PRINT "HELLO"\n')
          target=base/'valid.ssx'
          proc=subprocess.run(env+[str(source),*common,'-o',str(target)],capture_output=True,text=True)
          assert proc.returncode==0,(proc.returncode,proc.stdout,proc.stderr)
          rld.parse_ssx(target.read_bytes())
          print('Diagnostic-positive native SSX linked',target.stat().st_size)
          cases=[
            ('invalid.bas','10 FOR I=1TO10\n','BAS_UNEXPECTED_KEYWORD'),
            ('rom.bas','10 PRINT "HELLO" GO TO\n','ROM_C_SYNTAX'),
            ('tape.bas','10 LOAD "PART2"\n','RBC_TAPE_LOAD'),
            ('usr.bas','10 RANDOMIZE USR 32768\n','RBC_USR_MACHINE_CODE'),
          ]
          for name,listing,expected in cases:
            path=base/name; path.write_text(listing)
            dest=path.with_suffix('.ssx')
            p=subprocess.run(env+[str(path),*common,'-o',str(dest)],capture_output=True,text=True)
            print(name,'exit',p.returncode,repr(p.stderr[-400:]),flush=True)
            assert p.returncode!=0 and ('%RBC '+expected+' Line: 10 Statement: 1') in p.stderr
            assert '-RBC '+listing.strip() in p.stderr
            assert '^' in p.stderr and not dest.exists()
          p=subprocess.run(env+[str(source),*common,'--max','1','-o',str(base/'oversize.ssx')],capture_output=True,text=True)
          print('native limit exit',p.returncode,repr(p.stderr[-300:]),flush=True)
          assert p.returncode!=0 and '%RBC RBC_MEMORY_LIMIT Line: - Statement: -' in p.stderr
          assert 'configured compile limit is 1 bytes' in p.stderr
          assert not (base/'oversize.ssx').exists()
          p=subprocess.run(env+[str(source),'--bytecode'],capture_output=True,text=True)
          assert p.returncode==2 and '%RBC RBC_OUTPUT_MODE Line: - Statement: -' in p.stderr,(p.returncode,p.stderr)
          PY
