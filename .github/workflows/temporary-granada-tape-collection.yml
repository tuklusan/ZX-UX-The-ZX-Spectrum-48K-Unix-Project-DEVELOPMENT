name: Temporary Granada tape retrieval
on:
  push:
    paths:
      - .github/workflows/temporary-granada-tape-collection.yml
permissions:
  contents: read
concurrency:
  group: temporary-granada-tape-collection
  cancel-in-progress: false
jobs:
  retrieve:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Retrieve and validate Granada tape images
        shell: bash
        run: |
          import hashlib,html.parser,io,json,os,re,time,urllib.error,urllib.parse,urllib.request,zipfile
          from pathlib import Path
          class PageLinks(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__(); self.links=[];self.stack=[]
              def handle_starttag(self,tag,attrs):
                  if tag=="a":self.stack.append([dict(attrs).get("href",""),""])
              def handle_data(self,data):
                  for x in self.stack:x[1]+=data
              def handle_endtag(self,tag):
                  if tag=="a" and self.stack:self.links.append(self.stack.pop())
          class Restricted(Exception):pass
          ua="Mozilla/5.0 (compatible; one-time personal Granada tape archive)"
          root="https://worldofspectrum.org"
          manifest={"source":root+"/archive/publishers/Granada-Publishing","catalogue_entries":[],"tape_links_found":0,"tapes":[],"errors":[],"skipped":[]}
          def fetch(url,ref=None):
              for attempt in range(3):
                  try:
                      headers={"User-Agent":ua,"Accept":"*/*"}
                      if ref:headers["Referer"]=ref
                      req=urllib.request.Request(url,headers=headers)
                      with urllib.request.urlopen(req,timeout=27) as r:
                          mime=r.headers.get("Content-Type","")
                          data=r.read(16000000)
                          if len(data)>=16000000:raise ValueError("size exceeds 16 MB")
                          return data,mime,r.url
                  except urllib.error.HTTPError as e:
                      if e.code in (403,429,451):raise Restricted(str(e))
                      if e.code in (404,410):raise
                      if attempt==2:raise
                  except Exception:
                      if attempt==2:raise
                  time.sleep(4+attempt*5)
          def anchors(data):
              p=PageLinks();p.feed(data.decode("utf-8","replace"));return p.links
          def clean(s):
              return re.sub(r"[^A-Za-z0-9._ -]","_",s).strip(" ._")[:115] or "unnamed"
          def valid(data,suffix):
              if suffix==".tzx":return data.startswith(b"ZXTape!\x1a")
              if suffix==".pzx":return data.startswith(b"PZXT")
              if suffix==".tap":
                  pos=0
                  while pos<len(data):
                      if pos+2>len(data):return False
                      n=int.from_bytes(data[pos:pos+2],"little");pos+=2
                      if n<1 or pos+n>len(data):return False
                      pos+=n
                  return pos==len(data) and len(data)>2
              return False
          entries=[]
          try:
              data,_,_=fetch(manifest["source"])
              entries=[(text.strip(),urllib.parse.urljoin(root,url)) for url,text in anchors(data)
                       if url.startswith("/archive/software/") and url.endswith("-granada-publishing")]
              entries=list(dict.fromkeys(entries))
              manifest["catalogue_entries"]=[{"title":t,"url":u} for t,u in entries]
              print("CATALOGUE_ENTRIES",len(entries),flush=True)
          except Exception as e:
              manifest["errors"].append({"phase":"catalogue","error":str(e)})
              print("CATALOGUE_ERROR",repr(e),flush=True)
          tapes=Path("granada_collection");tapes.mkdir(exist_ok=True)
          names=set()
          blocked=False
          for idx,(title,url) in enumerate(entries,1):
              if blocked:break
              try:
                  body,_,_=fetch(url,manifest["source"])
                  ls=anchors(body)
                  links=[]
                  for href,label in ls:
                      if not label.strip().lower().startswith("granada publishing"):continue
                      path=urllib.parse.urlsplit(href).path.lower()
                      if not re.search(r"\.(tap|tzx|pzx)(\.zip)?$",path):continue
                      sourceurl=urllib.parse.urljoin(url,href)
                      links.append((sourceurl,label.strip()))
                  links=list(dict.fromkeys(links))
                  manifest["tape_links_found"]+=len(links)
                  print("TITLE",idx,"/",len(entries),title,"links",len(links),flush=True)
                  if not links:manifest["skipped"].append({"title":title,"reason":"No Granada tape link"})
                  for link,label in links:
                      time.sleep(2)
                      try:
                          content,mime,final=fetch(link,url)
                          extracted=[]
                          if zipfile.is_zipfile(io.BytesIO(content)):
                              with zipfile.ZipFile(io.BytesIO(content)) as z:
                                  for item in z.infolist():
                                      suffix=Path(item.filename).suffix.lower()
                                      if item.is_dir() or suffix not in (".tzx",".tap",".pzx"):continue
                                      if item.file_size>16000000:continue
                                      dat=z.read(item)
                                      extracted.append((Path(item.filename).name,dat,suffix))
                          else:
                              suffix=Path(urllib.parse.urlsplit(link).path).suffix.lower()
                              if suffix in (".tap",".tzx",".pzx"):
                                  extracted=[(Path(urllib.parse.urlsplit(link).path).name,content,suffix)]
                          if not extracted:raise ValueError("Download contained no TAP/TZX/PZX files, content-type="+mime)
                          for original,dat,suffix in extracted:
                              if not valid(dat,suffix):raise ValueError("Invalid "+suffix+" tape structure: "+original)
                              relative=clean(title)+"/"+clean(original)
                              if relative in names:
                                  name=Path(original)
                                  relative=clean(title)+"/"+clean(name.stem)+"-"+hashlib.sha256(dat).hexdigest()[:8]+suffix
                              names.add(relative)
                              path=tapes/relative;path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(dat)
                              manifest["tapes"].append({"title":title,"relative_path":relative,"format":suffix[1:],"bytes":len(dat),"sha256":hashlib.sha256(dat).hexdigest(),"source_url":link,"final_url":final,"description":label})
                      except Restricted as e:
                          blocked=True
                          manifest["errors"].append({"title":title,"source_url":link,"error":"Download restricted: "+str(e)})
                          print("RESTRICTED",repr(e),flush=True)
                          break
                      except Exception as e:
                          manifest["errors"].append({"title":title,"source_url":link,"error":str(e)})
                          print("DOWNLOAD_ERROR",title,repr(e),flush=True)
              except Restricted as e:
                  blocked=True
                  manifest["errors"].append({"title":title,"error":"Page restricted: "+str(e)})
                  print("RESTRICTED",title,repr(e),flush=True)
              except Exception as e:
                  manifest["errors"].append({"title":title,"error":"Page error: "+str(e)})
                  print("PAGE_ERROR",title,repr(e),flush=True)
              time.sleep(2)
          manifest["catalogue_entries_found"]=len(entries)
          manifest["titles_visited"]=sum(1 for x in entries[:idx]) if entries else 0
          manifest["tapes_saved"]=len(manifest["tapes"])
          Path("granada-manifest.json").write_text(json.dumps(manifest,indent=2))
          with zipfile.ZipFile("Granada-Publishing-Tapes.zip","w",compression=zipfile.ZIP_DEFLATED,compresslevel=9) as out:
              for p in sorted(tapes.rglob("*")):
                  if p.is_file():out.write(p,p.relative_to(tapes))
              out.write("granada-manifest.json","MANIFEST.json")
          print("FINAL_RESULT",json.dumps({"catalogue":len(entries),"links":manifest["tape_links_found"],"saved":manifest["tapes_saved"],"errors":len(manifest["errors"]),"skipped":len(manifest["skipped"]),"zip_bytes":Path("Granada-Publishing-Tapes.zip").stat().st_size,"zip_sha256":hashlib.sha256(Path("Granada-Publishing-Tapes.zip").read_bytes()).hexdigest()},sort_keys=True),flush=True)
      - name: Upload Granada archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: granada-tapes-only
          path: |
            Granada-Publishing-Tapes.zip
            granada-manifest.json
          if-no-files-found: warn
          retention-days: 1
