name: RBC upeepz80 size audit temporary
on:
  push:
    paths:
      - .github/workflows/rbc-upeepz80-size-temp.yml
permissions:
  contents: read
jobs:
  sizes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Acquire exact upstream optimizer revision
        run: |
          git clone --quiet https://github.com/tuklusan/upeepz80.git build/tmp/upstream-upeepz80
          git -C build/tmp/upstream-upeepz80 checkout --quiet --detach a48d725704b132c3ff23ac77232a3a412b56b15f
          test "$(git -C build/tmp/upstream-upeepz80 rev-parse HEAD)" = a48d725704b132c3ff23ac77232a3a412b56b15f
          grep -q 'GNU GENERAL PUBLIC LICENSE' build/tmp/upstream-upeepz80/LICENSE
      - name: Test native relocation-preserving output integration
        env:
          PYTHONPATH: build/tmp/upstream-upeepz80:experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk
        run: |
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p test_upeepz80_output.py -v
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p test_rbc_output.py -v
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p test_rbc_fit.py -v
      - name: Prove integrated RBC compile stage with real BAS input
        env:
          PYTHONPATH: build/tmp/upstream-upeepz80:build/tmp/pyhsb:build/tmp/rbc-compiled/rbc:src/zx-ux-sdk
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git build/tmp/pyhsb
          git -C build/tmp/pyhsb checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          git fetch --no-tags --depth=1 origin c3d270375af56768df3af6f5ceb38f83c9bd5bdd
          git show FETCH_HEAD:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > build/tmp/rbc-checkpoint.zip
          unzip -oq build/tmp/rbc-checkpoint.zip -d build/tmp/checkpoint
          mkdir -p build/tmp/rbc-compiled/rbc
          cp -a build/tmp/checkpoint/scratch/rbc/. build/tmp/rbc-compiled/rbc/
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py build/tmp/rbc-compiled experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py build/tmp/rbc-compiled experiments/hisoft-rbc-2026-10-22/stage
          mkdir -p build/tmp/fork-font
          git -C build/tmp/fork-font init -q
          git -C build/tmp/fork-font remote add origin https://github.com/tuklusan/font8x8.git
          git -C build/tmp/fork-font fetch -q --depth 1 origin 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          git -C build/tmp/fork-font checkout -q --detach FETCH_HEAD
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py build/tmp/fork-font/font8x8_basic.h build/tmp/rbc-compiled/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o build/tmp/HiSoft-BASIC-Compiler-v1.1-48K.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          python3 build/tmp/rbc-compiled/rbc/rbc.py src/bonus/60-programs/35-giant-rats/BASIC/35-giant-rats.bas --frontend build/tmp/pyhsb --sdk src/zx-ux-sdk --rom src/zx-ux-sdk/rom/48.rom --tape build/tmp/HiSoft-BASIC-Compiler-v1.1-48K.tap --upeepz80 -o build/tmp/35-giantrats-upeep.ssx
          cmp build/tmp/35-giantrats-upeep.ssx src/bonus/60-programs/35-giant-rats/bin/35-giant-rats.ssx
          echo "Upeepz80 end-to-end generated linked SSX verified byte-identical."
      - name: Reassemble and relink every published SSX through upeepz80
        env:
          PYTHONPATH: build/tmp/upstream-upeepz80:experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/upeepz80_measure.py --root . --workspace build/tmp/upeepz80-ssx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-upeepz80-native-sizes
          path: build/tmp/upeepz80-ssx/upeepz80-ssx-sizes.json
          retention-days: 1
