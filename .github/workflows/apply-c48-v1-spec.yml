name: Apply verified C48 v1 specification
on:
  push:
    paths:
      - .github/workflows/apply-c48-v1-spec.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  checked-spec-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact repository revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Verify and replace only the C48 specification
        shell: bash
        run: |
          set -euo pipefail
          test "$(git status --porcelain | wc -l)" -eq 0
          python3 - <<'PY'
          import base64, hashlib, io, pathlib, struct, zipfile, zlib
          p = pathlib.Path('docs/04-C48 Language Specification Rev 0.11.docx')
          original = p.read_bytes()
          assert len(original) == 1431372
          assert hashlib.sha1(b'blob '+str(len(original)).encode()+b'\0'+original).hexdigest() == '32ec23bd12ff4bade7850f00127c714d571545bf'
          with zipfile.ZipFile(io.BytesIO(original)) as z:
              assert z.testzip() is None
              srcxml = z.read('word/document.xml')
          patch = zlib.decompress(base64.b64decode(''))
          assert patch[:5] == b'ZXDX1'
          pos = 5
          xml = bytearray()
          while pos < len(patch):
              tag = patch[pos]; pos += 1
              if tag == 0:
                  n = struct.unpack_from('<I', patch, pos)[0]; pos += 4
                  xml.extend(patch[pos:pos+n]); pos += n
              elif tag == 1:
                  offset, n = struct.unpack_from('<II', patch, pos); pos += 8
                  assert offset + n <= len(srcxml)
                  xml.extend(srcxml[offset:offset+n])
              else:
                  raise ValueError('Unexpected patch opcode')
          assert pos == len(patch) and len(xml) == 360256
          out = io.BytesIO()
          with zipfile.ZipFile(io.BytesIO(original)) as old, zipfile.ZipFile(out, 'w') as new:
              for info in old.infolist():
                  new.writestr(info, bytes(xml) if info.filename == 'word/document.xml' else old.read(info.filename))
          result = out.getvalue()
          assert len(result) == 1430306
          assert hashlib.sha256(result).hexdigest() == '577a93270fcd14efc13b4b2b2e6c7c08eaafd24efbd771199ed4a0278ec037ec'
          assert hashlib.sha1(b'blob '+str(len(result)).encode()+b'\0'+result).hexdigest() == '7f36ca4c51879cea744bcc41e3e75675bbdf8ae4'
          with zipfile.ZipFile(io.BytesIO(result)) as checked:
              assert checked.testzip() is None and 'word/document.xml' in checked.namelist()
          p.write_bytes(result)
          print('Verified C48 v1 DOCX:', len(result), hashlib.sha256(result).hexdigest())
          PY
          test "$(git hash-object 'docs/04-C48 Language Specification Rev 0.11.docx')" = '7f36ca4c51879cea744bcc41e3e75675bbdf8ae4'
          test "$(git status --porcelain | wc -l)" -eq 1
          git add -- 'docs/04-C48 Language Specification Rev 0.11.docx'
          test "$(git diff --cached --name-only)" = 'docs/04-C48 Language Specification Rev 0.11.docx'
          git config user.name 'tuklusan'
          git config user.email 'tuklusan@users.noreply.github.com'
          git commit -m 'docs: use current ZX-UX v1 C48 specification'
          git push origin HEAD:main
