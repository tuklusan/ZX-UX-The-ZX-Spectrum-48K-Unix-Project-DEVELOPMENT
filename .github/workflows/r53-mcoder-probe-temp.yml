name: R53 compiler tape check temporary
on:
  push:
    paths:
      - .github/workflows/r53-mcoder-probe-temp.yml
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve MCoder III original copies
        shell: bash
        run: |
          mkdir -p .github/r53-lab-temp/tapes
          python3 - <<'PY'
          import urllib.request,json,zipfile,io,hashlib,pathlib
          sources={
            "mcoderiii-tap":"https://worldofspectrum.net/pub/sinclair/utils/z/ZXSpectrumCompilateur%28MCoderIII%29%28PSS%29.tap.zip",
            "mcoderiii-tzx":"https://worldofspectrum.net/pub/sinclair/utils/z/ZXSpectrumCompilateur%28PSS%29.tzx.zip"
          }
          out=pathlib.Path(".github/r53-lab-temp/tapes")
          rows=[]
          for name,url in sources.items():
            row={"name":name,"url":url}
            try:
              request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0"})
              with urllib.request.urlopen(request,timeout=25) as response:
                payload=response.read(2000000)
              row.update(archive_bytes=len(payload),archive_sha256=hashlib.sha256(payload).hexdigest())
              with zipfile.ZipFile(io.BytesIO(payload)) as bundle:
                row["files"]=[]
                for idx,member in enumerate(bundle.infolist()):
                  if member.is_dir() or not member.filename.lower().endswith((".tap",".tzx")):continue
                  contents=bundle.read(member)
                  path=out/(name+"-"+str(idx)+"."+member.filename.rsplit(".",1)[-1].lower())
                  path.write_bytes(contents)
                  row["files"].append({"filename":member.filename,"size":len(contents),"sha256":hashlib.sha256(contents).hexdigest()})
            except Exception as error:row["error"]=str(error)
            rows.append(row)
          (out/"results.json").write_text(json.dumps(rows,indent=2))
          print(json.dumps(rows))
          PY
      - name: Transfer compiler copies
        uses: actions/upload-artifact@v4
        with:
          name: r53-mcoderiii-tapes
          path: .github/r53-lab-temp/tapes/
          retention-days: 1
      - name: Record temporary run ID
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo "$GITHUB_RUN_ID" > .github/r53-lab-temp/run-id.txt
          git add .github/r53-lab-temp/run-id.txt
          git commit -m "lab: record MCoder III temporary run identifier"
          git pull --rebase origin main
          git push origin HEAD:main
