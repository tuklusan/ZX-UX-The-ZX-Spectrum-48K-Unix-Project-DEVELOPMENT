name: ZX-UX Manual One-Time Binary Delivery
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zxux-manual-byte-publish-once.yml'
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify original bytes and prepare Git blob
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, urllib.request
          repo = "tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT"
          parts = [["95bdaae398b48a09426ad381d30d7f7685a34213",983040],["50c714e33426b2e47000e379cfc99c20ebe2b6f8",983040],["bdd8d4c7a9d333bf3c58790eed2465140220b16b",983040],["f7065013fe13b6b680a0c8f03adefa58c7f66ec3",983040],["0f627eb601248d834e24b5426b0ac4cd90a0e13e",983040],["eb7f2a9d88382c1f5e23d7a7092df5dea2fd3cee",983040],["ade0f15f3ec9648f99e351538325ce4ded983402",672637]]
          expected_sha256 = 'fc8f8f7df80643c709e0ce7460134e23fefae0a84e6d8226bdfe181472b48327'
          expected_blob = '0d15bc15929a83fc52f17760a4294a14f5b5e4b3'
          token = os.environ['GH_TOKEN']
          headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}
          payload = bytearray()
          for sha, size in parts:
              url = 'https://api.github.com/repos/' + repo + '/git/blobs/' + sha
              with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=45) as response:
                  record = json.load(response)
              assert record['encoding'] == 'base64'
              block = base64.b64decode(record['content'])
              assert len(block) == size
              git_hash = hashlib.sha1(b'blob ' + str(size).encode() + b'\0' + block).hexdigest()
              assert git_hash == sha, ('chunk mismatch', sha, git_hash)
              payload.extend(block)
          assert len(payload) == 6570877
          assert hashlib.sha256(payload).hexdigest() == expected_sha256
          body = json.dumps({'content': base64.b64encode(payload).decode('ascii'), 'encoding': 'base64'}).encode('utf-8')
          url = 'https://api.github.com/repos/' + repo + '/git/blobs'
          request = urllib.request.Request(url, data=body, headers={**headers, 'Content-Type': 'application/json'}, method='POST')
          with urllib.request.urlopen(request, timeout=180) as response:
              created = json.load(response)
          assert created['sha'] == expected_blob, created['sha']
          print('Verified complete ZX-UX User Manual blob:', created['sha'], 'bytes:', len(payload))
          PY
