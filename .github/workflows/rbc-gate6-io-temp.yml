name: RBC Gate 6 printer and external channel safety trial
on:
  push:
    paths:
      - .github/workflows/rbc-gate6-io-temp.yml
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify native-tested source bytes in repository
        run: |
          set -e
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py)" = 839ac9c7fe164df26532d090a56ff9999047f4aa
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/stage/external_io_policy.py)" = d95886104d7cd1270cf04797aa485707fcdbd612
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/stage/diagnostics.py)" = a7ea1e50c9d75fec5c6b5ab68759ad2f7c2544e1
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/tests/test_external_io_policy.py)" = 86624ccab56c0efdd46074d37decc25aac242b0d
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/tests/test_finish_rbc_setup.py)" = 0ccaff6f174e26550c807b1c2e455fbef0c13e34
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/tests/test_diagnostics.py)" = 411b34d9c84a91f19876b56253e1cf69ed406ec0
      - name: Obtain pinned HiSoft and original compiler tape
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git upstream-pyhsb
          git -C upstream-pyhsb checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          mkdir -p trial-result build/tmp/rbc-gate2
          git fetch --no-tags --depth=1 origin c3d270375af56768df3af6f5ceb38f83c9bd5bdd
          git show FETCH_HEAD:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > /tmp/rbc-checkpoint.zip
          unzip -oq /tmp/rbc-checkpoint.zip -d build/tmp/rbc-gate2
          cp -R build/tmp/rbc-gate2/scratch/rbc trial-result/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          mkdir -p trial-result/fork-font
          git -C trial-result/fork-font init -q
          git -C trial-result/fork-font remote add origin https://github.com/tuklusan/font8x8.git
          git -C trial-result/fork-font fetch -q --depth 1 origin 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          git -C trial-result/fork-font checkout -q --detach FETCH_HEAD
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py trial-result/fork-font/font8x8_basic.h trial-result/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o trial-result/hisoft48.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
      - name: Test original printer and external channel safety
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          set -e
          for test in test_external_io_policy.py test_tape_policy.py test_finish_rbc_setup.py test_rom_syntax.py test_diagnostics.py; do
            python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test" -v
          done
          mkdir -p build/tmp/rbc-gate6-io
          python3 - <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          w=Path('build/tmp/rbc-gate6-io')
          cases={
             'lprint':('10 LPRINT "TEST"\n',True),
             'llist':('10 LLIST\n',True),
             'if1-cat':('10 CAT\n',True),
             'if1-format':('10 FORMAT "m";1\n',True),
             'if1-open':('10 OPEN #4;"m"\n',True),
             'quoted-rem':('10 PRINT "LPRINT LLIST": REM CAT FORMAT\n20 GO TO 20\n',False),
          }
          results={}
          for name,(listing,reject) in cases.items():
              src=w/(name+'.bas'); dst=w/(name+'.ssx')
              src.write_text(listing,encoding='ascii')
              cmd=[sys.executable,'trial-result/rbc/rbc.py',str(src),'--frontend','upstream-pyhsb',
                   '--sdk','src/zx-ux-sdk','--rom','src/zx-ux-sdk/rom/48.rom',
                   '--tape','trial-result/hisoft48.tap','--max','12000','-o',str(dst)]
              p=subprocess.run(cmd,capture_output=True,text=True,timeout=100)
              row={'exit':p.returncode,'stderr':p.stderr,'stdout':p.stdout,'binary':dst.exists()}
              row['pass']=(p.returncode!=0 and not dst.exists()) if reject else (p.returncode==0 and dst.exists())
              if name in ('lprint','llist'):
                  row['pass']=row['pass'] and 'RBC_PRINTER_UNSUPPORTED' in p.stderr
              if name=='if1-cat':
                  row['pass']=row['pass'] and 'RBC_INTERFACE_UNSUPPORTED' in p.stderr
              results[name]=row
              print('GATE6_IO',name,json.dumps(row),flush=True)
          (w/'summary.json').write_text(json.dumps(results,indent=2)+'\n')
          if not all(v['pass'] for v in results.values()):
              raise RuntimeError('External channel safety conditions not proven')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-gate6-external-io
          path: build/tmp/rbc-gate6-io/
          retention-days: 1
