name: ZX-UX disposable clean-room rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanroom-rebuild.yml
      - build/tools/cleanroom-build-using-github-action-runner.sh

permissions:
  contents: read

concurrency:
  group: zx-ux-cleanroom
  cancel-in-progress: false

jobs:
  cleanroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Targeted native captures on main push
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[targeted-capture]')
        shell: bash
        run: bash build/tools/cleanroom-build-using-github-action-runner.sh --targeted
      - name: Full clean-room audit on manual request
        if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[targeted-capture]')
        shell: bash
        run: bash build/tools/cleanroom-build-using-github-action-runner.sh
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-ux-cleanroom-audit
          path: cleanroom-logs/
          retention-days: 1
