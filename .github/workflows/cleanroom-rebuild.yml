name: ZX-UX disposable clean-room rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanroom-rebuild.yml
      - build/tools/cleanroom-build-using-github-action-runner.sh

permissions:
  contents: read

concurrency:
  group: zx-ux-cleanroom
  cancel-in-progress: false

jobs:
  cleanroom:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Build and audit from repository script
        shell: bash
        run: bash build/tools/cleanroom-build-using-github-action-runner.sh
      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-ux-cleanroom-audit
          path: cleanroom-logs/
          retention-days: 1

      - name: ZIP complete runner mirror after rebuild
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$GITHUB_WORKSPACE")"
          zip -q -r -y "$RUNNER_TEMP/zx-ux-cleanroom-runner-mirror.zip" "$(basename "$GITHUB_WORKSPACE")"
      - name: Upload full runner mirror ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-ux-cleanroom-runner-mirror
          path: ${{ runner.temp }}/zx-ux-cleanroom-runner-mirror.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
