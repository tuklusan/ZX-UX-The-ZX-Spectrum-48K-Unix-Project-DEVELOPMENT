name: RBC generic Phase 2 publish (temporary)
on:
  push:
    paths:
      - '.github/workflows/rbc-generic-publish-temp.yml'
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-generic-phase2-outcomes
          run-id: 40153765633
          github-token: ${{ github.token }}
          path: build/tmp/rbc-round2/
      - name: Recheck artifact and exact input provenance
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/round2_gates.py corpus
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          work=Path('build/tmp/rbc-round2')
          data=json.loads((work/'results.json').read_text())
          assert data['rbc_revision']=='8281f6b5921b5de112e3372b1a3c4f0370666495'
          assert len(data['results'])==60
          root=Path('src/bonus/60-programs')
          for game, entry in data['results'].items():
              orig=root/game/'BASIC'
              assert hashlib.sha256((orig/(game+'.bas')).read_bytes()).hexdigest()==entry['bas']['sha256_input'], game
              rhs=entry['tzx']
              expected=rhs.get('tape_sha256') or rhs['sha256_input']
              assert hashlib.sha256((orig/(game+'.tzx')).read_bytes()).hexdigest()==expected, game
              proposed=list((work/'published'/game/'bin').iterdir())
              assert len(proposed)==1
              assert proposed[0].name in ('README.md',game+'.ssx')
          print('120 unchanged inputs, 60 checked publication outcomes')
          PY
      - name: Publish exactly one verified outcome per bin
        run: |
          git fetch --no-tags origin main
          git merge --ff-only FETCH_HEAD
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          work=Path('build/tmp/rbc-round2')
          results=json.loads((work/'results.json').read_text())['results']
          root=Path('src/bonus/60-programs')
          for game in sorted(results):
              target=root/game/'bin'
              assert target.is_dir(), game
              existing=list(target.iterdir())
              assert all(f.is_file() and f.name in ('README.md',game+'.ssx') for f in existing),game
              incoming=list((work/'published'/game/'bin').iterdir())
              assert len(incoming)==1 and incoming[0].is_file(),game
              for item in existing:
                  item.unlink()
              shutil.copyfile(incoming[0],target/incoming[0].name)
              assert list(target.iterdir())[0].read_bytes()==incoming[0].read_bytes(),game
          PY
          git add -A -- src/bonus/60-programs
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert changed
          assert all(p.startswith('src/bonus/60-programs/') and '/bin/' in p for p in changed),changed
          print('Validated staged paths:',len(changed))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RBC: publish verified dual-source Phase 2 results'
          git push origin HEAD:refs/heads/main
