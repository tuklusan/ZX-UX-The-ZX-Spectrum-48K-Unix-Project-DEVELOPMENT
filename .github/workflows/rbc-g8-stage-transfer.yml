name: RBC temporary verified current stage transfer
on:
  push:
    paths:
      - '.github/workflows/rbc-g8-stage-transfer.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Bundle current stage and tests
        shell: bash
        run: |
          set -euo pipefail
          tar -czf rbc-g8-current-stage.tar.gz \
            experiments/hisoft-rbc-2026-10-22/stage \
            experiments/hisoft-rbc-2026-10-22/tests
          sha256sum rbc-g8-current-stage.tar.gz
      - name: Return exact checked-out source
        uses: actions/upload-artifact@v4
        with:
          name: rbc-g8-current-stage
          path: rbc-g8-current-stage.tar.gz
          if-no-files-found: error
          retention-days: 1
