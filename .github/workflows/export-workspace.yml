name: Export ZX-UX workspace
on:
  push:
    paths:
      - .github/workflows/export-workspace.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository and history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare source archive and history bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/zxux-export"
          git show-ref --verify refs/heads/main
          git archive --format=zip --prefix=ZX-UX/ --output="$RUNNER_TEMP/zxux-export/ZX-UX-main.zip" HEAD
          git bundle create "$RUNNER_TEMP/zxux-export/ZX-UX.bundle" --all
          git bundle verify "$RUNNER_TEMP/zxux-export/ZX-UX.bundle"
          git rev-parse HEAD > "$RUNNER_TEMP/zxux-export/source-sha.txt"
          cd "$RUNNER_TEMP/zxux-export"
          sha256sum ZX-UX-main.zip ZX-UX.bundle > SHA256SUMS.txt
      - name: Upload private checkout archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ZX-UX-workspace
          path: ${{ runner.temp }}/zxux-export/
          retention-days: 3
          if-no-files-found: error
