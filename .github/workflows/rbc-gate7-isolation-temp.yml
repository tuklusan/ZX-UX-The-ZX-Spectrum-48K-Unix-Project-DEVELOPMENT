name: RBC Gate 7 same kernel process isolation trial
on:
  push:
    paths:
      - .github/workflows/rbc-gate7-isolation-temp.yml
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Stage exact native process isolation probe
        run: |
          set -e
          curl -fsSL --retry 2 --max-time 25 \
            https://api.github.com/repos/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT/git/blobs/b7a19fef16da4970be34fbb48d4625ac0381bef6 \
            | python3 -c 'import json,sys,base64;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > experiments/hisoft-rbc-2026-10-22/stage/gate7_isolation_probe.py
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/stage/gate7_isolation_probe.py)" = b7a19fef16da4970be34fbb48d4625ac0381bef6
          curl -fsSL --retry 2 --max-time 25 \
            https://api.github.com/repos/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT/git/blobs/ee8253d737e472dd6571ea3da98110c679404cd4 \
            | python3 -c 'import json,sys,base64;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > experiments/hisoft-rbc-2026-10-22/tests/test_native_font_rt.py
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/tests/test_native_font_rt.py)" = ee8253d737e472dd6571ea3da98110c679404cd4
      - name: Obtain pinned HiSoft and original compiler tape
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git upstream-pyhsb
          git -C upstream-pyhsb checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          mkdir -p trial-result build/tmp/rbc-gate2
          git fetch --no-tags --depth=1 origin c3d270375af56768df3af6f5ceb38f83c9bd5bdd
          git show FETCH_HEAD:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > /tmp/rbc-checkpoint.zip
          unzip -oq /tmp/rbc-checkpoint.zip -d build/tmp/rbc-gate2
          cp -R build/tmp/rbc-gate2/scratch/rbc trial-result/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          mkdir -p trial-result/fork-font
          git -C trial-result/fork-font init -q
          git -C trial-result/fork-font remote add origin https://github.com/tuklusan/font8x8.git
          git -C trial-result/fork-font fetch -q --depth 1 origin 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          git -C trial-result/fork-font checkout -q --detach FETCH_HEAD
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py trial-result/fork-font/font8x8_basic.h trial-result/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o trial-result/hisoft48.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
      - name: Build exact ZX-UX kernel metadata for native execution
        if: always()
        run: |
          set -e
          git clone -q --recurse-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus-1.24.0
          git -C /tmp/sjasmplus-1.24.0 checkout -q --detach d379eeac9ad3857fb48fd3a3929175d0a56038ce
          git -C /tmp/sjasmplus-1.24.0 submodule update -q --init --recursive
          test "$(git -C /tmp/sjasmplus-1.24.0 rev-parse HEAD)" = d379eeac9ad3857fb48fd3a3929175d0a56038ce
          make -C /tmp/sjasmplus-1.24.0 USE_LUA=0 -j2 >/tmp/sjasm-build.log 2>&1 || { tail -100 /tmp/sjasm-build.log; exit 1; }
          /tmp/sjasmplus-1.24.0/build/release/sjasmplus --version
          mkdir -p build/src build/out
          cp -R src/zx-ux/. build/src/
          python3 -B src/zx-ux-sdk/tools/osbuild.py /tmp/sjasmplus-1.24.0/build/release/sjasmplus
          python3 - <<'PYBUILD'
          import re,sys
          from pathlib import Path
          sys.path.insert(0,'src/zx-ux-sdk/tools')
          import osbuild,turbo_boot_build
          syms={m.group(1):int(m.group(2),16) for line in Path('build/src/unix.sym').read_text().splitlines() if (m:=re.match(r'(\S+): EQU 0x([0-9A-Fa-f]+)',line))}
          _,_,free,_=osbuild.mkfs(syms,osbuild.program_list())
          turbo_boot_build.create_tzx('/tmp/sjasmplus-1.24.0/build/release/sjasmplus',syms,syms['kend']-0x6000,free,output_name='ZX-UX.tzx')
          if Path('build/out/ZX-UX.tzx').read_bytes()!=Path('dist/zx-ux/tzx/ZX-UX.tzx').read_bytes():
              raise RuntimeError('Rebuilt system tape does not match frozen release')
          if not Path('build/out/kernel.json').exists():
              raise RuntimeError('Rebuilt system kernel metadata missing')
          print('Native kernel and frozen tape exact match')
          PYBUILD
      - name: Native runtime and process isolation tests
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          set -e
          for test in test_native_sysvars_rt.py test_native_font_rt.py test_native_keyread_rt.py test_native_pause_rt.py test_native_run_rt.py test_safe_usr_native_z80.py test_spectrum_runtime.py test_rom_keyboard_control.py test_process_frame_clock.py; do
            python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test" -v
          done
          python3 experiments/hisoft-rbc-2026-10-22/stage/gate7_isolation_probe.py --work build/tmp/rbc-gate7 --system build/out/ZX-UX.tzx
      - name: Inspect independent native USR address and PEEK results
        if: always()
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          import rvm,rld
          folder=Path('build/tmp/rbc-gate7/address-diagnostic')
          folder.mkdir(parents=True,exist_ok=True)
          programs={
           'no-peek':'10 LET Q=0\n20 POKE USR "b",Q\n30 GO TO 30\n',
           'read-udg':'10 LET Q=PEEK USR "a"\n20 POKE USR "b",Q\n30 GO TO 30\n',
           'zero-then-read':'10 POKE USR "a",0\n20 LET Q=PEEK USR "a"\n30 POKE USR "b",Q\n40 GO TO 40\n',
           'raw-pointer':'10 LET A=USR "a"\n20 POKE USR "b",INT (A/256)\n30 POKE USR "b"+1,A-INT (A/256)*256\n40 LET Q=PEEK A\n50 POKE USR "b"+2,Q\n60 GO TO 60\n',
          }
          result={}
          for name,bas in programs.items():
              src=folder/(name+'.bas');ssx=folder/(name+'.ssx')
              src.write_text(bas,encoding='ascii')
              cmd=[sys.executable,'trial-result/rbc/rbc.py',str(src),
                   '--frontend','upstream-pyhsb','--sdk','src/zx-ux-sdk',
                   '--rom','src/zx-ux-sdk/rom/48.rom','--tape','trial-result/hisoft48.tap',
                   '--max','12000','-o',str(ssx)]
              p=subprocess.run(cmd,capture_output=True,text=True)
              row={'compile_exit':p.returncode,'stderr':p.stderr[-1500:]}
              if p.returncode==0:
                  vm=rvm.run_kernel(ssx,frames=300,system='build/out/ZX-UX.tzx',cache=True)
                  udg=vm.session.word(0x5c7b)
                  row.update(started=vm.fg.started is not None,why=vm.why,udg=udg,
                             a=vm.session.m.mem[udg],b=list(vm.session.m.mem[udg+8:udg+12]))
              result[name]=row
              print('GATE7_DIAGNOSTIC',name,json.dumps(row),flush=True)
          (folder/'results.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Trace native ROM workspace across sequential executions
        if: always()
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import rvm
          root=Path('build/tmp/rbc-gate7')
          options=rvm.Options()
          options.prog=str(root/'stop-and-font.ssx')
          options.system='build/out/ZX-UX.tzx'
          options.cache=True
          runner=rvm.Runner(options);runner.start()
          session=runner.session
          def snapshot(tag,job=None):
              mem=session.m.mem
              def word(i):return mem[i]+256*mem[i+1]
              glyph=word(0x5c7b)
              start=word(0x5c63);end=word(0x5c65)
              row={'tag':tag,'frame':session.m.frame,'stkb':start,'stke':end,
                   'worksp':word(0x5c61),'udg':glyph,
                   'a':mem[glyph],'b':mem[glyph+8],
                   'q':list(mem[glyph+168:glyph+173]),
                   'stack_bytes':list(mem[start:start+8]) if start<65528 else [],
                   'job_started':job.started if job is not None else None,
                   'job_ended':job.ended if job is not None else None}
              print('GATE7_STACK',json.dumps(row),flush=True)
              return row
          results=[]
          first=runner.fg
          results.append(snapshot('before-first',first))
          for _ in range(1500):
              runner.frame()
              if first.ended is not None:break
          results.append(snapshot('after-stop',first))
          file=root/'after-stop.ssx'
          second=session.launch(file.read_bytes(),rvm.zxux.program_name(str(file)))
          results.append(snapshot('before-second',second))
          seen=set()
          for _ in range(2500):
              runner.frame()
              if second.started is not None and second.ended is None:
                  elapsed=session.m.frame-second.started
                  for mark in (1,15,120,153):
                      if elapsed>=mark and mark not in seen:
                          results.append(snapshot('second-'+str(mark),second))
                          seen.add(mark)
              if second.ended is not None:break
          results.append(snapshot('after-second',second))
          (root/'stack-trace.json').write_text(json.dumps(results,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-gate7-process-evidence
          path: build/tmp/rbc-gate7/
          retention-days: 1
