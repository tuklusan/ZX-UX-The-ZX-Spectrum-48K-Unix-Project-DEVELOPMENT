name: RBC Round 3 focused verification
on:
  push:
    branches: [main]
    paths:
      - 'experiments/hisoft-rbc-2026-10-22/stage/**'
      - 'experiments/hisoft-rbc-2026-10-22/tests/**'
      - '.github/workflows/rbc-round3-phase-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Exact TZX token-source checks
        shell: bash
        run: |
          set -euo pipefail
          base=experiments/hisoft-rbc-2026-10-22
          python -m unittest discover -s "$base/tests" -p 'test_tzx_ascii.py' -v
          python -m unittest discover -s "$base/tests" -p 'test_round3_fidelity.py' -v
          PYTHONPATH="$base/stage" python - <<'PY'
          from pathlib import Path
          import importlib.util
          from basic_listing import encode_strict_listing
          from dual_source import validated_lines,semantic_check
          from tzx_ascii import to_ascii_listing
          spec=importlib.util.spec_from_file_location('zxux_tzx','build/tools/zx-tzx2bas.py')
          tool=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(tool)
          entries=tool._rom_token_entries()
          tokens={0xa5+i:word.decode('ascii') for i,(word,first,last) in enumerate(entries)}
          games=sorted(Path('src/bonus/60-programs').glob('[0-9][0-9]-*'))
          assert len(games)==60,len(games)
          successes=[]; failures=[]
          for game in games:
            p=game/'BASIC'/(game.name+'.tzx')
            progs=list(tool.basic_programs(p.read_bytes()))
            assert len(progs)==1,(game.name,len(progs))
            name,original=progs[0]
            try:
              listing=to_ascii_listing(validated_lines(original),tokens)
              restored=encode_strict_listing(listing)
              semantic_check(original,restored,None,tokens,'TZX reconstructed')
              authoritative=game/'BASIC'/(game.name+'.bas')
              from_bas=encode_strict_listing(authoritative.read_text(encoding='ascii'))
              semantic_check(from_bas,restored,None,tokens,'BAS/TZX')
              successes.append(game.name)
            except Exception as exc:
              failures.append((game.name,type(exc).__name__,str(exc)))
          print('Paired BAS and TZX round-trip results',len(successes),'successes',len(failures),'failures',flush=True)
          for item in failures:print('TZX not yet roundtrippable',repr(item),flush=True)
          expected={'02-fall-guy','13-radio-power','14-scuba','17-paypackets','48-energy-field','54-swordsman'}
          observed={item[0] for item in failures}
          if observed!=expected or any(item[1]!='SemanticDifference' for item in failures):
            raise SystemExit('Unexpected BAS/TZX fidelity outcomes: '+repr(failures))
          PY
      - uses: actions/checkout@v4
        with:
          repository: imneme/pyhsb
          ref: 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          path: build/tmp/rbc-round3/upstream
          persist-credentials: false
      - name: Real Z80 scroll counter virtualization and protected memory tests
        shell: bash
        run: |
          set -euo pipefail
          base=experiments/hisoft-rbc-2026-10-22/tests
          for pattern in test_round3_scroll_sysvar.py test_native_sysvars_rt.py test_round2_sysvars.py test_poke_policy.py test_poke_proof.py test_spectrum_runtime.py; do
            PYTHONPATH=build/tmp/rbc-round3/upstream python -m unittest discover -s "$base" -p "$pattern" -v
          done

      - uses: actions/checkout@v4
        with:
          repository: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT
          ref: f12650495d81df52a1835a71bef878be6a569e30
          path: build/tmp/rbc-round3/checkpoint-ref
          persist-credentials: false
      - name: Verify native RUN and source-preserving compiler paths
        shell: bash
        run: |
          set -euo pipefail
          stage=experiments/hisoft-rbc-2026-10-22/stage
          base=build/tmp/rbc-round3
          cpdir=$base/checkpoint-ref/experiments/hisoft-rbc-2026-10-22/temporary-checkpoint
          mkdir -p "$base/current/rbc"
          cp "$cpdir/rbc.py" "$base/current/rbc/rbc.py"
          cp "$cpdir/memory_safety.py" "$base/current/rbc/memory_safety.py"
          base64 -d "$cpdir/font32.b64" > "$base/current/rbc/font32.bin"
          python "$stage/prepare_rbc.py" "$base/current" "$stage"
          python "$stage/finish_rbc.py" "$base/current" "$stage"
          PYTHONPATH="$base/upstream" python -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_native_run_rt.py' -v
          curl -fsSL --retry 2 --max-time 30 -o "$base/hisoft48.tap" https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          printf '10 PRINT "RUN CHECK"\n20 RUN 10\n' > "$base/run.bas"
          PYTHONPATH="$base/upstream:$base/current/rbc:src/zx-ux-sdk" python "$base/current/rbc/rbc.py" "$base/run.bas" --frontend "$base/upstream" --sdk src/zx-ux-sdk --rom src/zx-ux-sdk/rom/48.rom --tape "$base/hisoft48.tap" -o "$base/run.ssx"
          PYTHONPATH=src/zx-ux-sdk python - <<'PY'
          import rld
          from pathlib import Path
          data=Path('build/tmp/rbc-round3/run.ssx').read_bytes()
          rld.parse_ssx(data)
          print('Real native RUN SSX linked',len(data),'bytes')
          PY
      - name: Inspect native RUN entry hook compilation state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess,sys
          from pathlib import Path
          file=Path('build/tmp/rbc-round3/current/rbc/native_run_rt.py')
          original=file.read_text()
          needle='    def entry_point_line(self):\\n'
          replace='    def entry_point_line(self):\\n        print("RUN entry invocation",self.line_no,self.pass0,self.storing,self._zxux_run_first,self._zxux_run_sp,flush=True)\\n'
          src=original.replace(needle.replace('\\n','\n'),replace.replace('\\n','\n'),1)
          if src==original: raise RuntimeError('entry hook missing')
          file.write_text(src)
          args=[sys.executable,'build/tmp/rbc-round3/current/rbc/rbc.py','build/tmp/rbc-round3/run.bas','--frontend','build/tmp/rbc-round3/upstream','--sdk','src/zx-ux-sdk','--rom','src/zx-ux-sdk/rom/48.rom','--tape','build/tmp/rbc-round3/hisoft48.tap','-o','build/tmp/rbc-round3/run-debug.ssx']
          try: subprocess.run(args,check=True)
          finally: file.write_text(original)
          PY
      - name: Focused original BASIC compilation after Phase B repairs
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src/zx-ux-sdk python - <<'PY'
          from pathlib import Path
          import subprocess,sys
          base=Path('build/tmp/rbc-round3')
          compiler=base/'current/rbc/rbc.py'
          frontend=base/'upstream'
          names=['02-fall-guy','04-horse-race','12-flying-bomb','14-scuba',
                 '18-newmarket','21-numbers','22-top-trainer','30-space-traffic',
                 '43-dogfight','47-exocet','51-anagrammatic','58-invaders',
                 '59-mushroom-invasion']
          for name in names:
              src=Path('src/bonus/60-programs')/name/'BASIC'/(name+'.bas')
              dest=base/'probes'/(name+'.ssx')
              dest.parent.mkdir(parents=True,exist_ok=True)
              cmd=[sys.executable,str(compiler),str(src),'--frontend',str(frontend),
                   '--sdk','src/zx-ux-sdk','--rom','src/zx-ux-sdk/rom/48.rom',
                   '--tape',str(base/'hisoft48.tap'),'-o',str(dest)]
              try:
                  r=subprocess.run(cmd,text=True,capture_output=True,timeout=25)
              except subprocess.TimeoutExpired:
                  print('Phase B original BAS probe',name,'timed out after 25s',flush=True)
                  continue
              diag=(r.stderr.strip() or r.stdout.strip()).splitlines()
              print('Phase B original BAS probe',name,'exit',r.returncode,
                    'linked',dest.is_file(),'bytes',dest.stat().st_size if dest.is_file() else None,
                    'detail',diag[-1][-230:] if diag else '',flush=True)
          PY
      - name: Rebuild and compare frozen ZX-UX system tape and metadata
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --branch v1.24.0 --depth 1 https://github.com/z00m128/sjasmplus.git build/tmp/rbc-round3/sjasmplus-src
          make -C build/tmp/rbc-round3/sjasmplus-src -j2 USE_LUA=0
          export SJASM="$(find build/tmp/rbc-round3/sjasmplus-src -type f -name sjasmplus -perm -111 | head -1)"
          test -x "$SJASM"
          "$SJASM" --version
          mkdir -p build/src build/out
          cp -a src/zx-ux/. build/src/
          python src/zx-ux-sdk/tools/osbuild.py "$SJASM"
          PYTHONPATH=src/zx-ux-sdk/tools python - <<'PY'
          from pathlib import Path
          import re
          import osbuild,turbo_boot_build
          text=Path('build/src/unix.sym').read_text()
          syms={m.group(1):int(m.group(2),16) for line in text.splitlines()
                if (m:=re.match(r'(\S+): EQU 0x([0-9A-Fa-f]+)',line))}
          _,_,free,_=osbuild.mkfs(syms,osbuild.program_list())
          turbo_boot_build.create_tzx(str(Path('build/tmp/rbc-round3/sjasmplus-src/sjasmplus').resolve()),syms,syms['kend']-0x6000,
                                      free,output_name='ZX-UX.tzx')
          original=Path('dist/zx-ux/tzx/ZX-UX.tzx').read_bytes()
          recreated=Path('build/out/ZX-UX.tzx').read_bytes()
          assert original==recreated,'kernel boot tape differs from frozen release'
          assert Path('build/out/kernel.json').is_file()
          print('Frozen ZX-UX tape verified:',len(recreated),'bytes')
          PY
      - name: Boot all published RBC SSX in the real ZX-UX rvm
        shell: bash
        run: |
          set -euo pipefail
          python experiments/hisoft-rbc-2026-10-22/stage/round3_runtime_smoke.py
      - name: Diagnose native RUN startup and STOP
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk python - <<'PY'
          from round3_native_system_probe import compile_one, ROOT
          import rvm
          samples = {
              'rbc-r3-run-min': '10 RUN 100\\n100 STOP\\n',
              'rbc-r3-run-print': '10 PRINT "BEFORE": RUN 100\\n100 PRINT "AFTER": STOP\\n',
              'rbc-r3-run-let': '10 LET A=7\\n20 RUN 100\\n100 STOP\\n',
              'rbc-r3-run-sys': '10 POKE 23692,42\\n20 RUN 100\\n100 STOP\\n',
          }
          for name, source in samples.items():
              try:
                  ssx = compile_one(name, source.replace('\\n','\n'))
                  run = rvm.run_kernel(ssx, frames=250, system=ROOT/'build/out/ZX-UX.tzx', cache=True)
                  fg = run.fg
                  print('native RUN diagnostic',name,'why',run.why,'status',fg.status,'syscalls',run.session.syscalls, 'PC',hex(run.session.m.cpu.pc),'SP',hex(run.session.m.cpu.sp), flush=True)
              except Exception as exc:
                  print('native RUN diagnostic failed',name,type(exc).__name__,str(exc),flush=True)
          PY
      - name: Isolate native RUN restart suboperations
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk python - <<'PY'
          from pathlib import Path
          from round3_native_system_probe import compile_one, ROOT
          import rvm, rld
          raw = (ROOT/'build/tmp/rbc-round3/rbc-r3-run-min.ssx').read_bytes()
          parsed = rld.parse_ssx(raw)
          img = parsed['image']
          for code in (b'\xed\x73',b'\xed\x7b'):
              print('RUN SP opcode',code.hex(),[(i,int.from_bytes(img[i+2:i+4],'little')) for i in range(len(img)-4) if img[i:i+2]==code],flush=True)
          print('RUN SSX image',len(img),'BSS',parsed['bss'],'relocation count',len(parsed['relocs']),flush=True)
          file = ROOT/'build/tmp/rbc-round3/current/rbc/native_run_rt.py'
          original = file.read_text()
          sequences = {
              'no_rest': [('        self.emit_restore()\\n', '')],
              'no_fill': [('        self.ld_hl(self.vars_start)\\n        self.ld_bc_abs((self._zxux_run_clear_bytes - 1) & 0xffff)\\n        self.emit(\'ld a,0\')\\n        self.call_rt(compiler.RT.MEM_FILL)\\n', '')],
              'no_stack': [('        self.emit_op_reloc(\'ld sp,(nn)\', self._zxux_run_sp)\\n', '')],
              'stack_only': [('        self.ld_hl(self.vars_start)\\n        self.ld_bc_abs((self._zxux_run_clear_bytes - 1) & 0xffff)\\n        self.emit(\'ld a,0\')\\n        self.call_rt(compiler.RT.MEM_FILL)\\n', ''), ('        self.emit_restore()\\n','')],
              'fill_only': [('        self.emit_op_reloc(\'ld sp,(nn)\', self._zxux_run_sp)\\n',''), ('        self.emit_restore()\\n','')],
              'rest_only': [('        self.emit_op_reloc(\'ld sp,(nn)\', self._zxux_run_sp)\\n', ''), ('        self.ld_hl(self.vars_start)\\n        self.ld_bc_abs((self._zxux_run_clear_bytes - 1) & 0xffff)\\n        self.emit(\'ld a,0\')\\n        self.call_rt(compiler.RT.MEM_FILL)\\n', '')],
              'jump_only': [('        self.emit_op_reloc(\'ld sp,(nn)\', self._zxux_run_sp)\\n', ''), ('        self.ld_hl(self.vars_start)\\n        self.ld_bc_abs((self._zxux_run_clear_bytes - 1) & 0xffff)\\n        self.emit(\'ld a,0\')\\n        self.call_rt(compiler.RT.MEM_FILL)\\n', ''), ('        self.emit_restore()\\n','')],
          }
          for name,changes in sequences.items():
              try:
                  text=original
                  for old,new in changes:
                      old=old.replace('\\n','\n')
                      if text.count(old)!=1: raise RuntimeError('RUN operation replacement not unique')
                      text=text.replace(old,new,1)
                  file.write_text(text)
                  ssx=compile_one('rbc-r3-'+name, '10 RUN 100\n100 STOP\n')
                  run=rvm.run_kernel(ssx,frames=200,system=ROOT/'build/out/ZX-UX.tzx',cache=True)
                  print('RUN isolation',name,run.why,run.fg.status,run.session.syscalls,flush=True)
              except Exception as exc:
                  print('RUN isolation failure',name,type(exc).__name__,str(exc),flush=True)
              finally:
                  file.write_text(original)
          PY
      - name: Check whether RUN startup damages an unreached restart
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk python - <<'PY'
          from round3_native_system_probe import compile_one, ROOT
          import rvm,rld
          from pathlib import Path
          for name, source in (
              ('rbc-r3-unreached','10 STOP\n20 RUN 10\n'),
              ('rbc-r3-minimal','10 RUN 100\n100 STOP\n'),
          ):
              path=compile_one(name,source)
              parsed=rld.parse_ssx(path.read_bytes())
              img=parsed['image']
              spots=[(i,img[i:i+18].hex()) for i in range(len(img)-18) if img[i:i+7]==bytes.fromhex('f5e52102003922')]
              print('RUN startup image',name,'length',len(img),'BSS',parsed['bss'],'shims',spots,'prefix',img[:100].hex(),flush=True)
              runner=rvm.run_kernel(path,frames=140,system=ROOT/'build/out/ZX-UX.tzx',cache=True)
              print('RUN startup kernel result',name,'why',runner.why,'status',runner.fg.status,'PC',hex(runner.session.m.cpu.pc),'SP',hex(runner.session.m.cpu.sp),flush=True)
          PY
      - name: Compare RUN code entry with and without stack-save wrapper
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk python - <<'PY'
          from round3_native_system_probe import compile_one,ROOT
          import rvm,rld
          path=ROOT/'build/tmp/rbc-round3/current/rbc/rbc.py'
          original=path.read_text()
          for variant in ('withsave','withoutsave'):
              try:
                  if variant=='withoutsave':
                      needle='    if has_restart_slot:\n'
                      if original.count(needle)!=1: raise RuntimeError('save hook not unique in generated RBC')
                      path.write_text(original.replace(needle,'    if False and has_restart_slot:\n',1))
                  source='10 STOP\n20 RUN 10\n'
                  ssx=compile_one('rbc-r3-'+variant,source)
                  parsed=rld.parse_ssx(ssx.read_bytes())
                  img=parsed['image']
                  prefix=img.find(b'\xed\x73')
                  dest=int.from_bytes(img[prefix+2:prefix+4],'little') if prefix>=0 else None
                  print('RUN direct compare',variant,'image',len(img),'BSS',parsed['bss'],'ED73',prefix,'save_target',dest,'entry_bytes',img[145:240].hex(),flush=True)
                  runner=rvm.run_kernel(ssx,frames=125,system=ROOT/'build/out/ZX-UX.tzx',cache=True)
                  mem=bytes(runner.session.m.mem)
                  physical=mem.find(b'\xed\x73')
                  if physical>=0 and dest is not None:
                      load=physical-prefix
                      absolute=load+dest
                      stored=int.from_bytes(mem[absolute:absolute+2],'little') if 0<=absolute<len(mem)-2 else None
                  else:
                      load=absolute=stored=None
                  print('RUN direct compare result',variant,'why',runner.why,'status',runner.fg.status,'runtime_ED73',physical,'load',load,'slot',absolute,'storedSP',stored,flush=True)
              finally:
                  path.write_text(original)
          PY
      - name: Check STOP behavior with and without an unreachable RUN
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage:src/zx-ux-sdk python - <<'PY'
          from round3_native_system_probe import compile_one,ROOT
          import rvm,rld
          samples=[
            ('rbc-r3-stop-only','10 STOP\n'),
            ('rbc-r3-print-stop','10 PRINT "X"\n20 STOP\n'),
            ('rbc-r3-stop-run','10 PRINT "X"\n20 STOP\n30 RUN 10\n'),
            ('rbc-r3-run-stop','10 PRINT "X"\n20 RUN 100\n100 STOP\n')
          ]
          for name,src in samples:
              try:
                  path=compile_one(name,src)
                  r=rvm.run_kernel(path,frames=160,system=ROOT/'build/out/ZX-UX.tzx',cache=True)
                  print('RUN focused STOP result',name,r.why,r.fg.status,r.session.syscalls,flush=True)
              except Exception as exc:
                  print('RUN focused STOP error',name,str(exc),flush=True)
          PY
      - name: Prove RUN restart and font restoration in the real ZX-UX kernel
        shell: bash
        run: |
          set -euo pipefail
          python experiments/hisoft-rbc-2026-10-22/stage/round3_native_system_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-round3-runtime-15
          path: |
            build/tmp/rbc-round3/runtime-15.json
            build/tmp/rbc-round3/rbc-r3-*.ssx
          if-no-files-found: warn
