name: RBC symbolic Z80 checker snapshot temporary
on:
  push:
    paths:
      - '.github/workflows/rbc-preassembly-checker-temp.yml'
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Snapshot exact changed compiler source
        run: |
          mkdir -p build/tmp/preassembly-checker/stage build/tmp/preassembly-checker/tests
          for p in rbc_fit.py finish_rbc.py round2_runner.py upeepz80_codegen.py; do
            cp "experiments/hisoft-rbc-2026-10-22/stage/$p" "build/tmp/preassembly-checker/stage/$p"
          done
          cp experiments/hisoft-rbc-2026-10-22/tests/test_upeepz80_codegen.py build/tmp/preassembly-checker/tests/
          sha256sum build/tmp/preassembly-checker/stage/* build/tmp/preassembly-checker/tests/*
      - uses: actions/upload-artifact@v4
        with:
          name: rbc-preassembly-checker-sources
          path: build/tmp/preassembly-checker/
          retention-days: 1
