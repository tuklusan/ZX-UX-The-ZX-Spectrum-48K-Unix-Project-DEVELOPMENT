name: ZX-UX RBC collections rebuild

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-rbc-collections.yml

permissions:
  contents: read

concurrency:
  group: zx-ux-rbc-collections-release
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run project-owned rebuild
        run: bash build/tools/rebuild-rbc-collections.sh --build
