name: ZX-UX RBC collections rebuild

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/rebuild-rbc-collections.yml
      - build/tools/asset_gallery.py
      - build/tools/gallery_index.py
      - build/tools/capture_quality.py
      - build/tools/portfolio.py
      - build/tools/fuse_portfolio.py
      - build/tools/basic_portfolio.py
      - build/tools/basic_fuse_portfolio.py
      - build/tools/compiler_portfolio.py
      - tests/test_capture_quality.py
  push:
    branches: [main]
    paths:
      - .github/workflows/rebuild-rbc-collections.yml
      - build/tools/rebuild-rbc-collections.sh
      - src/zx-ux-sdk/rbc/symbolic_patch_binding.py
      - build/tools/compile-rbc-collections.py
      - tests/test_rbc_cassette_collision.py
      - tests/test_rbc_next_branch.py

permissions:
  contents: read

concurrency:
  group: zx-ux-rbc-collections-release
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Run project-owned rebuild
        run: bash build/tools/rebuild-rbc-collections.sh --build
      - name: Retain rebuilt distribution and native sources
        uses: actions/upload-artifact@v4
        with:
          name: rbc-rebuilt-outputs
          path: |
            dist/
            src/assets/basic-src/original-sinclair-basic-collections/numerical-analysis/*/bin/
          if-no-files-found: error
          retention-days: 7
