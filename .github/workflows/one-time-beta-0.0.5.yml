name: Create beta-0.0.5 private tag
on:
  push:
    branches:
      - main
    paths:
      - docs/BETA-0.0.5-SIGNOFF-2026-10-14.md
permissions:
  contents: write
jobs:
  create-tag:
    if: github.repository == 'tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify release signoff and create immutable tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project
          EXPECTED_SIGNOFF_BLOB: ba3f4562a440384f28fb9c9a978659e00b0e9295
          TAG_NAME: beta-0.0.5
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$REPOSITORY"
          test "$GITHUB_REF" = 'refs/heads/main'
          commit="$GITHUB_SHA"
          test -n "$commit"
          file_sha="$(gh api "repos/$REPOSITORY/contents/docs/BETA-0.0.5-SIGNOFF-2026-10-14.md?ref=$commit" --jq '.sha')"
          test "$file_sha" = "$EXPECTED_SIGNOFF_BLOB"
          msg="$(gh api "repos/$REPOSITORY/commits/$commit" --jq '.commit.message')"
          test "$msg" = 'Sign off private beta-0.0.5 release'
          head="$(gh api "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
          test "$head" = "$commit"
          if gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" >/dev/null 2>&1; then
            echo 'This tag already exists; refusing to change it.' >&2
            exit 1
          fi
          gh api -X POST "repos/$REPOSITORY/git/refs" \
            -f "ref=refs/tags/$TAG_NAME" -f "sha=$commit" >/dev/null
          actual="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG_NAME" --jq '.object.sha')"
          test "$actual" = "$commit"
          echo "Created and verified $TAG_NAME at $actual"
