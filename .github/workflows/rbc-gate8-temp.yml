name: RBC Gate 8 temporary tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve locked frontend
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage python3 - <<'PY'
          from pathlib import Path
          from hisoft_frontend_inputs import copy_frontend
          copy_frontend(Path('build/tmp/rbc-upstream-frontend'))
          PY
          echo "PYTHONPATH=$PWD/build/tmp/rbc-upstream-frontend" >> "$GITHUB_ENV"
      - name: Source and native tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_symbolic_*.py' -v
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_typed_whole_pipeline.py' -v
          for path in experiments/hisoft-rbc-2026-10-22/tests/test_gate8_*.py; do
            if [[ "$path" == *test_gate8_pause_assembly.py ]]; then continue; fi
            python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "${path##*/}" -v
          done
          PYTHONPATH="$PWD/experiments/hisoft-rbc-2026-10-22/tests:$PYTHONPATH" python3 -m unittest \
            test_gate8_pause_assembly.NativePauseSource.test_native_assembler_emits_exact_runtime \
            test_gate8_pause_assembly.NativePauseSource.test_corrupted_pause_source_is_rejected -v
      - name: Preserve source for independent native gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rbc-gate8-checkout
          path: |
            experiments/hisoft-rbc-2026-10-22
            build/tmp/rbc-upstream-frontend
          retention-days: 1
