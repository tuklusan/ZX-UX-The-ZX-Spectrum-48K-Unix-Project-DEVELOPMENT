name: RBC Gate 8 temporary tests
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source and native tests
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_symbolic_*.py' -v
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_typed_whole_pipeline.py' -v
          python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p 'test_gate8_*.py' -v
