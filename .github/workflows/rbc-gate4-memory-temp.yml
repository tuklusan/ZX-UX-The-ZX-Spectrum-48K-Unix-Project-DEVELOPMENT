name: RBC fourteen native memory measurements
on:
  push:
    paths:
      - .github/workflows/rbc-gate4-memory-temp.yml
      - experiments/hisoft-rbc-2026-10-22/stage/native_run_rt.py
      - experiments/hisoft-rbc-2026-10-22/tests/test_native_run_rt.py
      - experiments/hisoft-rbc-2026-10-22/tests/test_poke_proof.py
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Obtain pinned HiSoft and original compiler tape
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git upstream-pyhsb
          git -C upstream-pyhsb checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          mkdir -p trial-result build/tmp/rbc-gate2
          git fetch --no-tags --depth=1 origin c3d270375af56768df3af6f5ceb38f83c9bd5bdd
          git show FETCH_HEAD:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > /tmp/rbc-checkpoint.zip
          unzip -oq /tmp/rbc-checkpoint.zip -d build/tmp/rbc-gate2
          cp -R build/tmp/rbc-gate2/scratch/rbc trial-result/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          mkdir -p trial-result/fork-font
          git -C trial-result/fork-font init -q
          git -C trial-result/fork-font remote add origin https://github.com/tuklusan/font8x8.git
          git -C trial-result/fork-font fetch -q --depth 1 origin 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          git -C trial-result/fork-font checkout -q --detach FETCH_HEAD
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py trial-result/fork-font/font8x8_basic.h trial-result/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o trial-result/hisoft48.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
      - name: Obtain exact pinned upeepz80 optimizer and verified trial script
        run: |
          set -e
          git clone -q https://github.com/avwohl/upeepz80.git upstream-upeepz80
          git -C upstream-upeepz80 checkout -q --detach a48d725704b132c3ff23ac77232a3a412b56b15f
          test "$(git -C upstream-upeepz80 rev-parse HEAD)" = a48d725704b132c3ff23ac77232a3a412b56b15f
          curl -fsSL --retry 2 --max-time 25 \
            https://api.github.com/repos/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT/git/blobs/2e1c611cdb45d0032d7d00b336bedd051e47fe19 \
            | python3 -c 'import json,sys,base64;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            > experiments/hisoft-rbc-2026-10-22/stage/gate4_memory_audit.py
          test "$(git hash-object experiments/hisoft-rbc-2026-10-22/stage/gate4_memory_audit.py)" = 2e1c611cdb45d0032d7d00b336bedd051e47fe19
      - name: Focused native assembly and compiler optimization tests
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:upstream-upeepz80:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          set -e
          for test in test_upeepz80_codegen.py test_rbc_fit.py test_native_sysvars_rt.py test_safe_usr_native_z80.py; do
            python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test" -v
          done
      - name: Build exact ZX-UX kernel metadata for native execution
        if: always()
        run: |
          set -e
          git clone -q --recurse-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus-1.24.0
          git -C /tmp/sjasmplus-1.24.0 checkout -q --detach d379eeac9ad3857fb48fd3a3929175d0a56038ce
          git -C /tmp/sjasmplus-1.24.0 submodule update -q --init --recursive
          test "$(git -C /tmp/sjasmplus-1.24.0 rev-parse HEAD)" = d379eeac9ad3857fb48fd3a3929175d0a56038ce
          make -C /tmp/sjasmplus-1.24.0 USE_LUA=0 -j2 >/tmp/sjasm-build.log 2>&1 || { tail -100 /tmp/sjasm-build.log; exit 1; }
          /tmp/sjasmplus-1.24.0/build/release/sjasmplus --version
          mkdir -p build/src build/out
          cp -R src/zx-ux/. build/src/
          python3 -B src/zx-ux-sdk/tools/osbuild.py /tmp/sjasmplus-1.24.0/build/release/sjasmplus
          python3 - <<'PYBUILD'
          import re,sys
          from pathlib import Path
          sys.path.insert(0,'src/zx-ux-sdk/tools')
          import osbuild,turbo_boot_build
          syms={m.group(1):int(m.group(2),16) for line in Path('build/src/unix.sym').read_text().splitlines() if (m:=re.match(r'(\S+): EQU 0x([0-9A-Fa-f]+)',line))}
          _,_,free,_=osbuild.mkfs(syms,osbuild.program_list())
          turbo_boot_build.create_tzx('/tmp/sjasmplus-1.24.0/build/release/sjasmplus',syms,syms['kend']-0x6000,free,output_name='ZX-UX.tzx')
          if Path('build/out/ZX-UX.tzx').read_bytes()!=Path('dist/zx-ux/tzx/ZX-UX.tzx').read_bytes():
              raise RuntimeError('Rebuilt system tape does not match frozen release')
          if not Path('build/out/kernel.json').exists():
              raise RuntimeError('Rebuilt system kernel metadata missing')
          print('Native kernel and frozen tape exact match')
          PYBUILD
      - name: Measure the 14 original oversized games with and without upeepz80
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:upstream-upeepz80:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/gate4_memory_audit.py --workspace build/tmp/rbc-gate4 --system build/out/ZX-UX.tzx
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-gate4-memory-evidence
          path: build/tmp/rbc-gate4/
          retention-days: 1
