name: ZX-UX one-time Debian 13 offline dependency verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/collect-debian13-deps.yml

permissions:
  contents: write

concurrency:
  group: zx-ux-cleanroom
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DEBIAN_FRONTEND: noninteractive
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Download complete Debian 13 dependency closure and Pillow
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo debian:13 \
            bash build/dependencies/fetch-host-packages.sh
          sudo chown -R "$(id -u):$(id -g)" build/dependencies/debian-13-amd64
          shopt -s nullglob
          debs=(build/dependencies/debian-13-amd64/apt/*.deb)
          wheels=(build/dependencies/debian-13-amd64/pip/*.whl)
          (("${#debs[@]}" > 0 && "${#wheels[@]}" > 0))
          echo "Collected ${#debs[@]} APT packages and ${#wheels[@]} wheels."

      - name: Verify fresh Debian 13 installation with networking disabled
        shell: bash
        run: |
          set -euo pipefail
          bash -n build/dependencies/install-debian13-offline.sh
          docker run --rm --network none -v "$PWD:/repo" -w /repo debian:13 \
            bash -euo pipefail -c '
              bash build/dependencies/install-debian13-offline.sh
              git config --global --add safe.directory /repo
              command -v Xvfb
              test -x /usr/bin/fuse-sdl
              test -f /usr/share/fuse/fuse.font
              /tmp/zxux-py/bin/python -c "from PIL import Image, ImageGrab, ImageChops; assert hasattr(Image.new(\"L\",(1,1)), \"get_flattened_data\")"
              export PATH="/tmp/zxux-py/bin:$PATH"
              python3 -B build/build.py /usr/local/bin/sjasmplus
              echo "PASS: Debian 13 offline dependencies, Pillow, SJASMPlus and ZX-UX build"
            ' 2>&1 | tee dependency-audit.log

      - name: Commit and push packages and wheel
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build/dependencies/debian-13-amd64/apt/*.deb \
                     build/dependencies/debian-13-amd64/pip/*.whl
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] Include verified Debian 13 offline dependencies and Pillow"
            git push origin HEAD:main
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zx-ux-debian13-offline-verification
          path: dependency-audit.log
          retention-days: 1
