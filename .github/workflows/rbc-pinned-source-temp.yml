name: RBC temporary optimizer source retrieval
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Retrieve exact upstream revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/avwohl/upeepz80.git upstream
          git -C upstream checkout --quiet a48d725704b132c3ff23ac77232a3a412b56b15f
          test "$(git -C upstream rev-parse HEAD)" = a48d725704b132c3ff23ac77232a3a412b56b15f
          test "$(git hash-object upstream/upeepz80/__init__.py)" = d5bf9e1ca2f80d671c09231520af1470cb7a185e
          test "$(git hash-object upstream/upeepz80/peephole.py)" = 067ac45ed935fbe90f9e24a864cdf2eca163cc4c
          test "$(git hash-object upstream/upeepz80/z80.py)" = 550b14e167a4a265aada5901d86e506225a9a1b9
      - name: Archive reviewed source
        uses: actions/upload-artifact@v4
        with:
          name: rbc-pinned-optimizer-source
          path: upstream/upeepz80/
          if-no-files-found: error
          retention-days: 1
