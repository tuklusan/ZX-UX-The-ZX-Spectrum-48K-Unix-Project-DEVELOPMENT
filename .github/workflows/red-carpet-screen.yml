name: Red Carpet 48K score-screen test
on:
  push:
    branches: [research/typein-scans-20261023]
    paths:
      - 'recovery/typein-48k/red-carpet/**'
      - '.github/workflows/red-carpet-screen.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout BASIC syntax tool
        uses: actions/checkout@v4
        with:
          repository: tuklusan/zmakebas-plus
          path: tools/zmakebas-plus
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build BASIC syntax tool
        run: |
          cd tools/zmakebas-plus
          npm ci --no-audit --no-fund
          npm run build:cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Fuse and screen tools
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fuse-emulator-sdl spectrum-roms xvfb
          python -m pip install --disable-pip-version-check pillow python-xlib
      - name: Build 48K BASIC tapes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/tapes output/screens output/logs
          for item in main high new; do
            if [ "$item" = main ]; then
              src=recovery/typein-48k/red-carpet/red-carpet-1983-high-score-rebuilt.bas
            else
              src=recovery/typein-48k/red-carpet/red-carpet-$item-screen-test.bas
            fi
            node tools/zmakebas-plus/dist-cli/zmakebas.js -a 5 -o "output/tapes/red-carpet-$item.tap" "$src" > "output/logs/red-carpet-$item.txt" 2>&1
            python recovery/typein-48k/scripts/zx_basic_tape.py convert "output/tapes/red-carpet-$item.tap" "output/tapes/red-carpet-$item.tzx"
            python recovery/typein-48k/scripts/zx_basic_tape.py inspect "output/tapes/red-carpet-$item.tzx" > "output/logs/red-carpet-$item.json"
          done
          sha256sum output/tapes/* > output/logs/tape-sha256.txt
      - name: Run actual Fuse 48K screens
        shell: bash
        run: |
          set -euo pipefail
          rom="$(find /usr/share -type f -name 48.rom | head -1)"
          test -s "$rom"
          for item in main high new; do
            if [ "$item" = main ]; then wait=5; else wait=6; fi
            python recovery/typein-48k/scripts/fuse_48_capture.py \
              "output/tapes/red-carpet-$item.tzx" --rom "$rom" \
              --out "output/screens/$item" --display :97 \
              --boot-wait 12 --wait "$wait" --final-wait 0 \
              > "output/logs/fuse-$item.log" 2>&1
          done
      - name: Save program and score-screen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-carpet-48k-score-screen
          path: output/
          if-no-files-found: warn
          retention-days: 3
