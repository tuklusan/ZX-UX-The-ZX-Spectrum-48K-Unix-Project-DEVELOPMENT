name: Spectrum 48K magazine BASIC tape checks
on:
  push:
    branches: [research/typein-scans-20261023]
    paths:
      - 'recovery/typein-48k/**'
      - '.github/workflows/spectrum-typein-48k.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-and-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Sinclair BASIC checker
        uses: actions/checkout@v4
        with:
          repository: tuklusan/zmakebas-plus
          path: tools/zmakebas-plus
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build checker
        run: |
          cd tools/zmakebas-plus
          npm ci --no-audit --no-fund
          npm run build:cli
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install emulation screen dependencies
        run: python -m pip install --disable-pip-version-check pillow python-xlib
      - name: Install 48K emulator
        run: |
          sudo add-apt-repository -y universe
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends fuse-emulator-sdl spectrum-roms xvfb zip
          find /usr/share -name 48.rom -print
      - name: Validate tapes and capture independent Fuse screens
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/tapes output/screens output/logs output/rejected
          rom="$(find /usr/share -type f -name 48.rom | head -1)"
          test -s "$rom"
          echo 'program,checker,tape,fuse,screenshot' > output/logs/results.csv
          x=91
          for src in recovery/typein-48k/programs/*.bas; do
            name="$(basename "$src" .bas)"
            if ! node tools/zmakebas-plus/dist-cli/zmakebas.js -o "output/tapes/$name.tap" "$src" >"output/logs/$name-checker.txt" 2>&1; then
              cp "$src" "output/rejected/$name.bas"
              echo "$name,fail,no,not-run,no" >> output/logs/results.csv
              continue
            fi
            if ! python3 recovery/typein-48k/scripts/zx_basic_tape.py convert "output/tapes/$name.tap" "output/tapes/$name.tzx" >>"output/logs/$name-checker.txt" 2>&1; then
              echo "$name,pass,fail,not-run,no" >> output/logs/results.csv
              continue
            fi
            python3 recovery/typein-48k/scripts/zx_basic_tape.py inspect "output/tapes/$name.tzx" >"output/logs/$name-tape.json"
            args=()
            if [[ "$name" == 'spectrum-says' ]]; then args=(--type-lines 1 --step-wait 1); fi
            if python recovery/typein-48k/scripts/fuse_48_capture.py "output/tapes/$name.tzx" --fuse fuse-sdl --rom "$rom" --out "output/screens/$name" --display ":$x" --wait 7 --after-key r,Return --after-wait 1 --pre-action-wait 3 --samples 2 --sample-interval 1 "${args[@]}" >"output/logs/$name-capture.txt" 2>&1; then
              count="$(find "output/screens/$name" -name '*.png' -size +500c | wc -l)"
              if [[ "$count" -ge 4 ]]; then
                if [[ "$name" == 'spectrum-says' ]]; then
                  if python -c 'import sys; from PIL import Image; im=Image.open(sys.argv[1]).convert("RGB"); pixels=im.crop((0,0,280,205)).getdata(); amount=sum(1 for r,g,b in pixels if max(r,g,b)-min(r,g,b)>=70 and max(r,g,b)>=90); print("gameplay-color-pixels:",amount); assert amount>300' "output/screens/$name/75-input-01.png" >>"output/logs/$name-screen-check.txt" 2>&1; then
                    echo "$name,pass,pass,started,yes" >> output/logs/results.csv
                  else
                    echo "$name,pass,pass,not-proven,no" >> output/logs/results.csv
                  fi
                else
                  echo "$name,pass,pass,unreviewed,yes" >> output/logs/results.csv
                fi
              else echo "$name,pass,pass,attempted,no" >> output/logs/results.csv; fi
            else
              echo "$name,pass,pass,failed,no" >> output/logs/results.csv
            fi
            x=$((x+1))
          done
          find output/tapes -name '*.tap' -delete
          sha256sum output/tapes/*.tzx > output/logs/tape-sha256.txt || true
          (cd output/tapes && zip -9 -q ../spectrum-48k-individual-tzx.zip ./*.tzx) || true
          cat output/logs/results.csv
      - name: Upload per-program tapes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-48k-tzx
          path: output/spectrum-48k-individual-tzx.zip
          if-no-files-found: warn
          retention-days: 14
      - name: Upload Fuse screens and checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectrum-48k-verification
          path: |
            output/screens
            output/logs
            output/rejected
          if-no-files-found: warn
          retention-days: 14