name: RBC computed RUN native trial
on:
  push:
    paths:
      - .github/workflows/rbc-run-computed-temp.yml
      - experiments/hisoft-rbc-2026-10-22/tests/test_poke_proof.py
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install exact unpublished RUN candidate sources for test only
        run: |
          set -e
          mkdir -p build/tmp/rbc-run-trial/checked-sources
          fetch_blob() {
            curl -fsSL --retry 2 --max-time 25 \
              "https://api.github.com/repos/tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT/git/blobs/$2" \
              | python3 -c 'import json,sys,base64;sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' > "$1"
            test "$(git hash-object "$1")" = "$2"
          }
          fetch_blob experiments/hisoft-rbc-2026-10-22/stage/native_run_rt.py d5cdaaae80a427b18860f0c8e3f0cc3909eef846
          fetch_blob experiments/hisoft-rbc-2026-10-22/tests/test_native_run_rt.py 1223e9bf0d93232df563a58ae50d733e455d0702
          cp experiments/hisoft-rbc-2026-10-22/stage/native_run_rt.py build/tmp/rbc-run-trial/checked-sources/
          cp experiments/hisoft-rbc-2026-10-22/tests/test_native_run_rt.py build/tmp/rbc-run-trial/checked-sources/
      - name: Obtain pinned HiSoft and original compiler tape
        run: |
          git clone -q https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git upstream-pyhsb
          git -C upstream-pyhsb checkout -q --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          mkdir -p trial-result build/tmp/rbc-gate2
          git fetch --no-tags --depth=1 origin c3d270375af56768df3af6f5ceb38f83c9bd5bdd
          git show FETCH_HEAD:experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip > /tmp/rbc-checkpoint.zip
          unzip -oq /tmp/rbc-checkpoint.zip -d build/tmp/rbc-gate2
          cp -R build/tmp/rbc-gate2/scratch/rbc trial-result/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          python3 experiments/hisoft-rbc-2026-10-22/stage/finish_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          mkdir -p trial-result/fork-font
          git -C trial-result/fork-font init -q
          git -C trial-result/fork-font remote add origin https://github.com/tuklusan/font8x8.git
          git -C trial-result/fork-font fetch -q --depth 1 origin 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          git -C trial-result/fork-font checkout -q --detach FETCH_HEAD
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py trial-result/fork-font/font8x8_basic.h trial-result/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o trial-result/hisoft48.tap https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
      - name: Test current typed USR and native routines
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk
        run: |
          set -e
          for test in test_safety_usr.py test_typed_usr_classifier.py test_safe_usr_rt.py test_native_pause_rt.py test_native_run_rt.py test_safe_usr_native_z80.py test_rbc_fit.py test_dual_source.py test_rom_syntax.py test_poke_proof.py test_poke_policy.py test_computed_lines.py test_udg_bounds.py test_udg_chr_bounds.py; do
            echo "=== $test ==="
            python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test" -v
          done
      - name: Build exact ZX-UX kernel metadata for native execution
        if: always()
        run: |
          set -e
          git clone -q --recurse-submodules https://github.com/z00m128/sjasmplus.git /tmp/sjasmplus-1.24.0
          git -C /tmp/sjasmplus-1.24.0 checkout -q --detach d379eeac9ad3857fb48fd3a3929175d0a56038ce
          git -C /tmp/sjasmplus-1.24.0 submodule update -q --init --recursive
          test "$(git -C /tmp/sjasmplus-1.24.0 rev-parse HEAD)" = d379eeac9ad3857fb48fd3a3929175d0a56038ce
          make -C /tmp/sjasmplus-1.24.0 USE_LUA=0 -j2 >/tmp/sjasm-build.log 2>&1 || { tail -100 /tmp/sjasm-build.log; exit 1; }
          /tmp/sjasmplus-1.24.0/build/release/sjasmplus --version
          mkdir -p build/src build/out
          cp -R src/zx-ux/. build/src/
          python3 -B src/zx-ux-sdk/tools/osbuild.py /tmp/sjasmplus-1.24.0/build/release/sjasmplus
          python3 - <<'PYBUILD'
          import re,sys
          from pathlib import Path
          sys.path.insert(0,'src/zx-ux-sdk/tools')
          import osbuild,turbo_boot_build
          syms={m.group(1):int(m.group(2),16) for line in Path('build/src/unix.sym').read_text().splitlines() if (m:=re.match(r'(\S+): EQU 0x([0-9A-Fa-f]+)',line))}
          _,_,free,_=osbuild.mkfs(syms,osbuild.program_list())
          turbo_boot_build.create_tzx('/tmp/sjasmplus-1.24.0/build/release/sjasmplus',syms,syms['kend']-0x6000,free,output_name='ZX-UX.tzx')
          if Path('build/out/ZX-UX.tzx').read_bytes()!=Path('dist/zx-ux/tzx/ZX-UX.tzx').read_bytes():
              raise RuntimeError('Rebuilt system tape does not match frozen release')
          if not Path('build/out/kernel.json').exists():
              raise RuntimeError('Rebuilt system kernel metadata missing')
          print('Native kernel and frozen tape exact match')
          PYBUILD
      - name: Compile and run computed RUN restart on native ZX-UX
        env:
          PYTHONPATH: upstream-pyhsb:trial-result/rbc:src/zx-ux-sdk:experiments/hisoft-rbc-2026-10-22/stage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,subprocess,sys,hashlib
          import rvm,rld
          root=Path.cwd()
          work=Path('build/tmp/rbc-run-trial')
          src=work/'run-computed.bas'
          src.write_text('10 LET N=100\n20 RUN N\n30 POKE USR "a",11\n40 GO TO 40\n100 IF N<>0 THEN GO TO 30\n110 POKE USR "a",73\n120 GO TO 120\n',encoding='ascii')
          out=work/'run-computed.ssx'
          cmd=[sys.executable,'trial-result/rbc/rbc.py',str(src),
               '--frontend','upstream-pyhsb','--sdk','src/zx-ux-sdk',
               '--rom','src/zx-ux-sdk/rom/48.rom','--tape','trial-result/hisoft48.tap',
               '--max','12000','-o',str(out),'--report',str(work/'run-computed.json')]
          p=subprocess.run(cmd,text=True,capture_output=True)
          (work/'compile.log').write_text(p.stdout+'\n'+p.stderr)
          print('COMPUTED_RUN_COMPILE',p.returncode,(p.stdout+p.stderr)[-1000:],flush=True)
          if p.returncode or not out.is_file(): raise RuntimeError('computed RUN native compiler failed')
          binary=out.read_bytes()
          info=rld.parse_ssx(binary)
          total=len(info['image'])+info['bss']+info['stack']
          if max(len(binary),total)>12000: raise RuntimeError('computed RUN exceeds default memory limit')
          vm=rvm.run_kernel(out,frames=470,system='build/out/ZX-UX.tzx',cache=True)
          if not (vm.fg and vm.fg.started is not None): raise RuntimeError('computed RUN process did not start')
          mem=vm.session.m.mem
          udg=mem[0x5c7b]+256*mem[0x5c7c]
          mark=mem[udg]
          report={'started':True,'run_destination_udg_byte':mark,'reason':vm.why,
                  'file':len(binary),'image':len(info['image']),'bss':info['bss'],'stack':info['stack'],
                  'total':total,'sha256':hashlib.sha256(binary).hexdigest()}
          (work/'native-result.json').write_text(json.dumps(report,indent=2)+'\n')
          print('COMPUTED_RUN_NATIVE',json.dumps(report),flush=True)
          if vm.why!='frames' or mark!=73: raise RuntimeError('computed RUN failed to restart at line 100 with cleared variables')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-run-computed-evidence
          path: build/tmp/rbc-run-trial/
          retention-days: 1
