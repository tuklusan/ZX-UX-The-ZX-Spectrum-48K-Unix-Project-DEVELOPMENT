name: ZXUX beta006 exact release object staging
on:
  push:
    branches:
      - zxux-chunk-probe-20261015
    paths:
      - .github/workflows/zxux-restore-release-only.yml
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Stage checked release blob tree and commit without modifying main
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          #!/usr/bin/env python3
          """Verify bundled release and stage identical Git objects without changing refs."""
          import base64
          import datetime
          import hashlib
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path
          
          REPO = 'tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT'
          BASE = 'fddebdb053774de054ce47bb177684c6e0c8f165'
          INITIAL = '8699a6f8bb44e90693f3389c7264ab6f758a7959'
          SOURCE_FIRST = '3eae938f95ed2ad5f2470e9b9d8dc40587803976'
          SOURCE_FIX = 'b97872136651732c6bc7651240937ae8c62ed9e3'
          SOURCE_MERGE = 'f06f260e790d361190924d77c24badefaa4d7c3d'
          RELEASE = 'f85ce0cb9853d3928bc52a90eb0abc12c9249c10'
          EXPECTED_BLOB = 'b572026b59d797627a80c840717889a2186c659b'
          EXPECTED_SHA256 = 'fd915f5721038307d563ed0d613f6b0dafbc882630e3fa830c568f27df00248d'
          TOKEN = os.environ['GH_TOKEN']
          API = 'https://api.github.com/repos/' + REPO
          
          
          def git(*args):
              return subprocess.check_output(['git', *args])
          
          
          def git_s(*args):
              return git(*args).decode('utf-8').strip()
          
          
          def api(path, data=None):
              method = 'POST' if data is not None else 'GET'
              payload = None if data is None else json.dumps(data, separators=(',', ':')).encode('utf-8')
              request = urllib.request.Request(API + path, data=payload, method=method,
                  headers={'Authorization': 'Bearer ' + TOKEN,
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'User-Agent': 'zxux-private-rehydration'})
              try:
                  with urllib.request.urlopen(request, timeout=90) as response:
                      return json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  sys.stderr.write(f'GitHub REST rejected {method} {path}: {exc.code}\n')
                  raise
          
          
          def fetch_bundle():
              obj = api('/git/blobs/' + EXPECTED_BLOB)
              assert obj.get('sha') == EXPECTED_BLOB and obj.get('size') == 511734
              assert obj.get('encoding') == 'base64'
              raw = base64.b64decode(obj['content'])
              assert len(raw) == 511734 and hashlib.sha256(raw).hexdigest() == EXPECTED_SHA256
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == EXPECTED_BLOB
              path = Path('/tmp/zxux-beta006-exact.bundle')
              path.write_bytes(raw)
              subprocess.run(['git', 'fetch', '--no-tags', 'origin', 'main'], check=True)
              subprocess.run(['git', 'bundle', 'verify', str(path)], check=True)
              subprocess.run(['git', 'fetch', '--no-tags', str(path),
                              'refs/heads/beta-0.0.6-staged:refs/heads/verified-beta006'], check=True)
              assert git_s('rev-parse', 'verified-beta006') == RELEASE
              assert git_s('rev-parse', SOURCE_FIX+'^{tree}') == 'd65d62da08a56c1ad53cfaaa69ca279980d025cc'
              assert git_s('rev-parse', RELEASE+'^{tree}') == '57d01769037fbaf1f4e965083ea4a8852339f716'
              assert git_s('rev-parse', RELEASE+'^') == SOURCE_MERGE
              assert git_s('merge-base', BASE, RELEASE) == BASE
              manifest = git('show', RELEASE+':release/manifest.txt').decode()
              entries = []
              for line in manifest.splitlines():
                  m = re.fullmatch(r'([a-f0-9]{64})\s+(\d+)\s+(\S.*)', line)
                  if m:
                      digest, length, rel = m.groups()
                      assert not rel.startswith('/') and '..' not in rel.split('/')
                      entries.append((digest, int(length), rel))
              assert len(entries) == 320
              expected = {'release/manifest.txt'} | {'release/'+t[2] for t in entries}
              observed = set(git_s('ls-tree', '-r', '--name-only', RELEASE, 'release/').splitlines())
              assert expected == observed
              for digest, length, rel in entries:
                  contents = git('show', RELEASE+':release/'+rel)
                  assert len(contents) == length and hashlib.sha256(contents).hexdigest() == digest, rel
              print('VERIFIED_BUNDLE_AND_ALL_320_MANIFEST_FILES', flush=True)
          
          
          def original_commit(commit):
              raw = git('cat-file', '-p', commit).decode('utf-8')
              headers, message = raw.split('\n\n', 1)
              props = {}
              parents = []
              for h in headers.splitlines():
                  key, val = h.split(' ', 1)
                  if key == 'parent': parents.append(val)
                  else:
                      assert key in ('tree', 'author', 'committer'), 'Unrecognized commit header'
                      props[key] = val
              def user(s):
                  m = re.fullmatch(r'(.+) <([^<>]+)> (\d+) ([+-]\d{4})', s)
                  assert m, 'Malformed Git author/committer identity'
                  name, email, epoch, offset = m.groups()
                  sign = 1 if offset[0] == '+' else -1
                  tz = datetime.timezone(sign * datetime.timedelta(
                      hours=int(offset[1:3]), minutes=int(offset[3:5])))
                  date = datetime.datetime.fromtimestamp(int(epoch),tz).isoformat(timespec='seconds')
                  return {'name':name,'email':email,'date':date}
              return {'message':message,'tree':props['tree'],'parents':parents,
                      'author':user(props['author']),'committer':user(props['committer'])}
          
          
          def reproduce_commit(sha):
              expected = original_commit(sha)
              response = api('/git/commits', expected)
              actual = response.get('sha')
              assert actual == sha, f'Exact Git commit reconstruction failed: {sha} -> {actual}'
              print('EXACT_GIT_COMMIT_STAGED', sha, flush=True)
          
          
          blobs_uploaded = set()
          
          def recreate_tree(old, new):
              raw = git('diff','--no-renames','--name-status','-z',old,new)
              words = raw.split(b'\0')
              assert words[-1] == b''
              words = words[:-1]
              assert len(words)%2 == 0
              tree = []
              for k in range(0,len(words),2):
                  status = words[k].decode('ascii')
                  path = words[k+1].decode('utf-8')
                  assert status in ('A','M','D') and path and '..' not in path.split('/')
                  if status == 'D':
                      tree.append({'path':path,'mode':'100644','type':'blob','sha':None})
                      continue
                  line = git('ls-tree','-z',new,'--',path)
                  assert line.endswith(b'\0') and line.count(b'\0') == 1
                  head, name = line[:-1].split(b'\t',1)
                  mode, kind, sha = head.decode().split(' ')
                  assert name.decode() == path and kind == 'blob'
                  assert mode in ('100644','100755','120000')
                  if sha not in blobs_uploaded:
                      body = git('cat-file','blob',sha)
                      response = api('/git/blobs',{'content':base64.b64encode(body).decode(), 'encoding':'base64'})
                      assert response.get('sha') == sha, f'Blob mismatch {path}'
                      blobs_uploaded.add(sha)
                      if len(blobs_uploaded)%25==0:
                          print('BLOBS_STAGED', len(blobs_uploaded), flush=True)
                  tree.append({'path':path,'mode':mode,'type':'blob','sha':sha})
              expected_tree = git_s('rev-parse',new+'^{tree}')
              before_tree = git_s('rev-parse',old+'^{tree}')
              response = api('/git/trees',{'base_tree':before_tree,'tree':tree})
              assert response.get('sha') == expected_tree, f'Tree SHA mismatch: {new}'
              print('EXACT_GIT_TREE_STAGED',expected_tree,'paths',len(tree),flush=True)
          
          
          def main():
              assert os.environ['GITHUB_REPOSITORY'] == REPO
              assert os.environ['GITHUB_REPOSITORY_ID'] == '1412173246'
              assert git_s('ls-remote','origin','refs/heads/main').split()[0] == SOURCE_MERGE
              assert not git_s('ls-remote','origin','refs/tags/beta-0.0.6')
              fetch_bundle()
              source = api('/git/commits/' + SOURCE_MERGE)
              assert source.get('sha') == SOURCE_MERGE
              assert source['tree']['sha'] == 'd65d62da08a56c1ad53cfaaa69ca279980d025cc'
              recreate_tree(SOURCE_MERGE,RELEASE)
              reproduce_commit(RELEASE)
              assert git_s('ls-remote','origin','refs/heads/main').split()[0] == SOURCE_MERGE
              print('ALL_EXACT_RELEASE_OBJECTS_STAGED_NO_REF_CHANGE',len(blobs_uploaded),RELEASE,flush=True)
          
          if __name__ == '__main__':
              main()
          PYCODE
