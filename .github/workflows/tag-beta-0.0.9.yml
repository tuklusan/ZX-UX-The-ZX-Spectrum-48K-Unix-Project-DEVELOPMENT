name: Create beta-0.0.9 tag once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tag-beta-0.0.9.yml'
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify finished release and tag it
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: dddf610cb99cfc3c9d601f27771e5d249cb43cce
          RELEASE_TREE: d04a3f85b6e230e3c0e46468e64e1b4ca48fe544
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'tuklusan/ZX-UX-The-ZX-Spectrum-48K-Unix-Project-DEVELOPMENT'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = "$RELEASE_SHA"
          test "$(git rev-parse "${RELEASE_SHA}^{tree}")" = "$RELEASE_TREE"
          test "$(git log -1 --format=%s)" = 'Prepare one-time beta-0.0.9 tag'
          test "$(find release/dist/screenshots/rvm -name '*.png' -type f | wc -l)" -eq 61
          test "$(find release/dist/screenshots/fuse -name '*.png' -type f | wc -l)" -eq 61
          for engine in rvm fuse; do
            test -s "release/dist/screenshots/$engine/index.html"
            test -s "release/dist/screenshots/$engine/games/3dpaint.png"
            test -s "release/dist/screenshots/$engine/multitask/hanoi-queens8-shell.png"
            test -s "release/dist/screenshots/$engine/multitask/mobius-torus-shell.png"
          done
          test -s release/dist/zx-ux/ZX-UX.tzx
          test -s release/dist/assets/c48-bin/tzx/3dpaint.tzx
          test ! -e release/dist/zx-ux/ZX-UX.tap
          ref_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/beta-0.0.9"
          result=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "$ref_api")
          test "$result" = '404'
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d "{\"ref\":\"refs/tags/beta-0.0.9\",\"sha\":\"${RELEASE_SHA}\"}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs"
