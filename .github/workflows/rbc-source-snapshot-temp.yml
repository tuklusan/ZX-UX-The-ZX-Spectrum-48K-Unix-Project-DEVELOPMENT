name: RBC temporary source snapshot
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rbc-source-snapshot-temp.yml'
jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Collect exact current RBC source and tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/tmp/rbc-transfer
          git rev-parse HEAD > build/tmp/rbc-transfer/revision.txt
          tar -czf build/tmp/rbc-transfer/source.tar.gz \
            experiments/hisoft-rbc-2026-10-22/stage \
            experiments/hisoft-rbc-2026-10-22/tests
          sha256sum build/tmp/rbc-transfer/source.tar.gz > build/tmp/rbc-transfer/digest.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rbc-temporary-source-snapshot
          path: build/tmp/rbc-transfer/
          if-no-files-found: error
          retention-days: 1
