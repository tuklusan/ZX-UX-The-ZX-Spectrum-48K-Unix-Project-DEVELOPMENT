name: RBC temporary live Gate 8 source transfer
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Record source identities
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git status --porcelain
          git ls-tree HEAD experiments/hisoft-rbc-2026-10-22/stage
      - name: Export checked source only
        uses: actions/upload-artifact@v4
        with:
          name: rbc-g8-live-source
          path: |
            experiments/hisoft-rbc-2026-10-22/stage/
            experiments/hisoft-rbc-2026-10-22/tests/
          retention-days: 1
