name: Clear processed Actions runs
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: zx-ux-action-run-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Test cleanup record handling
        run: python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p test_action_history_cleanup.py -v
      - name: Store results and remove processed runs
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: refs/heads/main
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python3 experiments/hisoft-rbc-2026-10-22/stage/action_history_cleanup.py --execute