name: RBC upstream tokenizer verification
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  token-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify vendored upstream revisions and prepared adapter source
        shell: bash
        run: |
          set -euo pipefail
          stage=experiments/hisoft-rbc-2026-10-22/stage
          test "$(git hash-object "$stage/bas2tap.py")" = 0bfe1f9ef8669e4fd264d3222a4e427628e62323
          test "$(git hash-object "$stage/bas2tap_syntax.py")" = 353878813d46d8f3722a2ddec5764fa2e1a0b72c
          python -m compileall -q "$stage"/basic_listing.py "$stage"/prepare_rbc.py
      - name: Verify 48K ROM and strict input tests (first fresh pass)
        shell: bash
        run: |
          set -euo pipefail
          for test in test_basic_listing test_at_tokenizer test_round2_fidelity test_rom_syntax test_dual_source; do
            python -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test.py" -v
          done
      - name: Verify 48K ROM and strict input tests (second fresh pass)
        shell: bash
        run: |
          set -euo pipefail
          for test in test_basic_listing test_at_tokenizer test_round2_fidelity test_rom_syntax test_dual_source; do
            python -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p "$test.py" -v
          done
      - uses: actions/checkout@v4
        with:
          repository: imneme/pyhsb
          ref: 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          path: build/tmp/rbc-round2/upstream
          persist-credentials: false
      - name: Restore original RBC checkpoint into untracked runner workspace
        shell: bash
        run: |
          set -euo pipefail
          cpdir=experiments/hisoft-rbc-2026-10-22/temporary-checkpoint
          root=build/tmp/rbc-round2
          mkdir -p "$root/checkpoint/scratch/rbc" "$root/current/rbc"
          for file in rbc.py memory_safety.py; do
            cp "$cpdir/$file" "$root/checkpoint/scratch/rbc/$file"
            cp "$cpdir/$file" "$root/current/rbc/$file"
          done
          base64 -d "$cpdir/font32.b64" > "$root/checkpoint/scratch/rbc/font32.bin"
          cp "$root/checkpoint/scratch/rbc/font32.bin" "$root/current/rbc/font32.bin"
          stage=experiments/hisoft-rbc-2026-10-22/stage
          python "$stage/prepare_rbc.py" "$root/current" "$stage"
          python "$stage/finish_rbc.py" "$root/current" "$stage"
          python -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -p test_tokenizer_checkpoint.py -v
      - name: Focused RBC system variables, fonts, memory, and fidelity
        shell: bash
        run: |
          set -euo pipefail
          base=experiments/hisoft-rbc-2026-10-22/tests
          for test in test_round2_sysvars test_round2_fonts test_round2_memory test_round2_fidelity test_native_sysvars_rt test_native_font_rt test_native_font_link test_spectrum_fonts test_spectrum_sysvars test_rom_syntax test_tzx_ascii test_safety_usr test_poke_policy test_poke_proof; do
            PYTHONPATH=build/tmp/rbc-round2/upstream python -m unittest discover -s "$base" -p "$test.py" -v
          done
      - name: Verify real HiSoft native compilation and SSX link
        shell: bash
        run: |
          set -euo pipefail
          root=build/tmp/rbc-round2
          curl -fsSL --retry 2 --max-time 30 -o "$root/hisoft48.tap" https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          test -s "$root/hisoft48.tap"
          printf '10 PRINT "RBC NATIVE TEST"\n' > "$root/hello.bas"
          PYTHONPATH="$root/upstream:$root/current/rbc:src/zx-ux-sdk" python "$root/current/rbc/rbc.py" "$root/hello.bas" --frontend "$root/upstream" --sdk src/zx-ux-sdk --rom src/zx-ux-sdk/rom/48.rom --tape "$root/hisoft48.tap" -o "$root/hello.ssx" --report "$root/hello.json"
          PYTHONPATH=src/zx-ux-sdk python - <<'PY'
          from pathlib import Path
          import rld
          target=Path('build/tmp/rbc-round2/hello.ssx')
          payload=target.read_bytes()
          assert payload.startswith(b'SSX1'), payload[:4]
          parsed=rld.parse_ssx(payload)
          assert len(parsed['image']) > 0
          print('Linked SSX1 executable:', len(payload), 'bytes')
          PY
      - name: Independently recover all 60 TZX input listings
        shell: bash
        run: |
          set -euo pipefail
          python build/tools/zx-tzx2bas.py --corpus src/bonus/60-programs --out-dir build/tmp/rbc-tokenizer-tzx
          PYTHONPATH=experiments/hisoft-rbc-2026-10-22/stage python - <<'PY'
          from pathlib import Path
          from basic_listing import encode_strict_listing
          base = Path('src/bonus/60-programs')
          games = sorted(p for p in base.iterdir() if p.is_dir() and p.name[:2].isdigit())
          assert len(games) == 60
          total = 0
          for game in games:
              bas = game / 'BASIC' / (game.name + '.bas')
              from_tzx = Path('build/tmp/rbc-tokenizer-tzx') / game.name / 'BASIC' / (game.name + '.bas')
              for path in (bas, from_tzx):
                  text = path.read_text(encoding='ascii')
                  encoded = encode_strict_listing(text)
                  assert encoded, f'Empty input: {path}'
                  total += 1
          assert total == 120, total
          print('Verified 60 independent BAS and 60 TZX-derived token streams')
          PY