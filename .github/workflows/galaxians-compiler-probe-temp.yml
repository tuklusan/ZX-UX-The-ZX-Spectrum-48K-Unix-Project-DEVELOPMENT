name: Galaxians compiler temporary lab cleanup
on:
  push:
    paths:
      - .github/workflows/galaxians-compiler-probe-temp.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove only temporary Galaxians lab files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r --ignore-unmatch -- .github/galaxians-lab-temp .github/workflows/galaxians-compiler-probe-temp.yml
          git commit -m "lab: remove temporary Galaxians compiler runner and test files"
          git pull --rebase origin main
          git push origin HEAD:main
