name: RBC Python compiler trial
on:
  push:
    paths:
      - '.github/workflows/rbc-upstream-trial.yml'
      - 'experiments/hisoft-rbc-2026-10-22/stage/**'
      - 'experiments/hisoft-rbc-2026-10-22/tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Acquire Python BASIC compiler source
        run: |
          git clone https://github.com/tuklusan/Python-BASIC-Compiler-for-ZX-Spectrum-Hisoft.git upstream-pyhsb
          git -C upstream-pyhsb checkout --detach 7cc87dafb58fcf5632b7190320dd11c30b4fe961
          python3 -m compileall -q upstream-pyhsb
      - name: Verify Sinclair jump behavior and 8x8 font conversion
        run: python3 -m unittest discover -s experiments/hisoft-rbc-2026-10-22/tests -v
      - name: Prepare ZX-UX compiler and the original tape inputs
        run: |
          mkdir -p trial-result
          unzip -oq experiments/hisoft-rbc-2026-10-22/rbc-fresh-chat-2026-10-22.zip -d trial-result/checkpoint
          cp -R trial-result/checkpoint/scratch/rbc trial-result/rbc
          python3 experiments/hisoft-rbc-2026-10-22/stage/prepare_rbc.py trial-result experiments/hisoft-rbc-2026-10-22/stage
          cp trial-result/checkpoint/scratch/test_memory_safety.py trial-result/test_memory_safety.py
          python3 trial-result/test_memory_safety.py
          git clone --depth 1 https://github.com/tuklusan/font8x8.git trial-result/fork-font
          git -C trial-result/fork-font checkout --detach 8e279d2d864e79128e96188a6b9526cfa3fbfef9
          python3 experiments/hisoft-rbc-2026-10-22/stage/font_from_fork.py trial-result/fork-font/font8x8_basic.h trial-result/rbc/font32.bin
          curl -fsSL --retry 2 --max-time 25 -o trial-result/hisoft48.tap \
            https://www.cs.hmc.edu/~oneill/spectrum/classics/HiSoft-BASIC-Compiler-v1.1-48K.tap
          python3 - <<'PY'
          import sys, json
          from pathlib import Path
          sys.path.insert(0,'trial-result/rbc')
          import rbc
          conversion_errors={}
          for source in sorted(Path('src/bonus/60-programs').glob('*/BASIC/*.tzx')):
              target=Path('trial-result/tokenized')/source.parent.parent.name/(source.stem+'.tap')
              target.parent.mkdir(parents=True,exist_ok=True)
              try:
                  target.write_bytes(rbc._tap_from_tzx(source))
              except Exception as exc:
                  conversion_errors[str(source)]=repr(exc)
                  print(f'WARN: {source}: {exc}')
          Path('trial-result/hello.bas').write_text('10 PRINT "HELLO"\n')
          Path('trial-result/tape-conversion-errors.json').write_text(json.dumps(conversion_errors,indent=2)+chr(10))
          PY
      - name: Record shared source hashes
        run: |
          sha256sum trial-result/hisoft48.tap trial-result/rbc/rbc.py \
            trial-result/rbc/font32.bin upstream-pyhsb/compiler.py \
            > trial-result/inputs.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: rbc-shared
          path: |
            trial-result/rbc/
            trial-result/tokenized/
            trial-result/hello.bas
            trial-result/tape-conversion-errors.json
            trial-result/hisoft48.tap
            trial-result/inputs.sha256
            upstream-pyhsb/
          retention-days: 1
  trial:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    env:
      RBC_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: rbc-shared
          path: .
      - name: Verify shared input hashes
        run: sha256sum -c trial-result/inputs.sha256
      - name: Verify original Galaxians text and tape token parity
        if: matrix.shard == 2
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path[:0] = ['upstream-pyhsb', 'trial-result/rbc']
          import compiler, hbcimage, rbc, source, tap
          folder = Path('src/bonus/60-programs/25-galaxians/BASIC')
          rom = Path('src/zx-ux-sdk/rom/48.rom').read_bytes()
          kw = source.Keywords(rom)
          fp = compiler.Compiler(hbcimage.Image.from_tape(Path('trial-result/hisoft48.tap')), rom).fp
          _, listing = rbc._source_program(folder/'25-galaxians.bas', source, kw, fp)
          _, original = tap.program_of_tap(rbc._tap_from_tzx(folder/'25-galaxians.tzx'))
          if listing != original:
              sys.exit('Galaxians text disagrees with the original tokenized tape')
          print('Original Galaxians BASIC lines matched:', len(tap.split_lines(original)))
          PY
      - name: Compile BASIC sources and collect results
        run: |
          python3 - <<'PY'
          import json, os, subprocess, sys, hashlib
          from pathlib import Path
          root=Path('src/bonus/60-programs')
          out=Path('trial-result')
          shard=int(os.environ['RBC_SHARD'])
          folders=sorted(root.glob('[0-9][0-9]-*'))
          if len(folders)!=60:sys.exit(f'expected 60 BASIC programs; got {len(folders)}')
          inputs=[('hello',out/'hello.bas')] if shard==0 else []
          for folder in folders[shard*12:(shard+1)*12]:
              raw=next(folder.glob('BASIC/*.bas'),None)
              tap=out/'tokenized'/folder.name/(raw.stem+'.tap') if raw else None
              inputs.append((folder.name+'-text',raw))
              inputs.append((folder.name+'-tape',tap if tap and tap.is_file() else None))
          results=[]
          conversion_errors=json.loads((out/'tape-conversion-errors.json').read_text())
          compiler_hash=hashlib.sha256((out/'rbc/rbc.py').read_bytes()).hexdigest()
          for name,source in inputs:
              binary=out/(name+'.ssx')
              report=out/(name+'.json')
              row={'program':name,'input':str(source) if source else None,
                   'input_sha256':hashlib.sha256(source.read_bytes()).hexdigest() if source else None,
                   'tool_sha256':compiler_hash,'revision':os.environ.get('GITHUB_SHA'),
                   'output_path':str(binary),'report_path':str(report),
                   'output_sha256':None,'native_result':None,
                   'ok':False,'cause_category':None,'returncode':None,'output':''}
              if source is None:
                  row['cause_category']='missing-input'
                  if name.endswith('-tape'):
                      folder=name[:-5]
                      original=root/folder/'BASIC'/(folder+'.tzx')
                      row['output']=conversion_errors.get(str(original),'converted tape unavailable')
                  else:
                      row['output']='original text input unavailable'
              else:
                  cmd=[sys.executable,str(out/'rbc/rbc.py'),str(source),
                       '--frontend','upstream-pyhsb','--sdk','src/zx-ux-sdk',
                       '--rom','src/zx-ux-sdk/rom/48.rom',
                       '--tape',str(out/'hisoft48.tap'),
                       '-o',str(binary),'--report',str(report)]
                  try:
                      run=subprocess.run(cmd,stdout=subprocess.PIPE,
                                         stderr=subprocess.STDOUT,text=True,timeout=100)
                      row['returncode']=run.returncode
                      row['output']=run.stdout
                      row['ok']=run.returncode==0 and binary.is_file()
                      if not row['ok']:
                          output=run.stdout.lower()
                          row['cause_category']=('memory' if 'memory' in output else
                                                 'source-parse' if 'sourceerror' in output or 'syntax' in output else
                                                 'compiler-error')
                  except subprocess.TimeoutExpired as exc:
                      row['cause_category']='timeout'
                      row['output']=str(exc)+'; partial output: '+str(exc.stdout)
                  except Exception as exc:
                      row['cause_category']='runner-error'
                      row['output']=repr(exc)
              if binary.is_file():
                  row['output_sha256']=hashlib.sha256(binary.read_bytes()).hexdigest()
              results.append(row)
              last_line=row['output'].splitlines()[-1] if row['output'] else ''
              print(f'{name}: {"PASS" if row["ok"] else "FAIL"} ({row["cause_category"]}): {last_line[:350]}',flush=True)
          (out/f'rbc-60-results-shard-{shard}.json').write_text(json.dumps(results,indent=2)+chr(10))
          if shard==0 and not results[0]['ok']:sys.exit('HELLO compiler regression')
          if shard==0:
              required = {'08-chomper-text','08-chomper-tape',
                          '11-defend-text','11-defend-tape'}
              failed = sorted(name for name in required if not any(
                  item['program'] == name and item['ok'] for item in results))
              if failed:
                  sys.exit('computed BASIC jump compile regression: '+','.join(failed))
          if shard==1 and not any(x['program']=='23-biorhythms-text' and x['ok']
                                  for x in results):
              sys.exit('Biorhythms text-listing compiler regression')
          print('SHARD=',shard,'PASS=',sum(x['ok'] for x in results),'TOTAL=',len(results))
          PY
      - name: Run bounded native ZX-UX boot tests
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'dist/sdk/bin/py')
          import rvm
          out=Path('trial-result')
          shard=int(os.environ['RBC_SHARD'])
          system=Path('dist/zx-ux/tzx/ZX-UX.tzx')
          outcomes=[]
          errors=[]
          for ssx in sorted(out.glob('*.ssx')):
              if not ssx.name.endswith('-tape.ssx') and ssx.name not in (
                      'hello.ssx','23-biorhythms-text.ssx'):
                  continue
              try:
                  run=rvm.run_kernel(str(ssx),system=str(system),frames=120)
                  bitmap,border=run.picture()
                  rvm.write_png(bitmap,str(out/(ssx.stem+'.png')),border)
                  row={'program':ssx.stem,'booted':True,'result':run.why,
                       'exit_status':run.fg.status if run.fg is not None else None,
                       'bitmap_nonempty':any(bitmap),
                       'foreground_started': bool(run.fg and run.fg.started is not None)}
              except Exception as e:
                  row={'program':ssx.stem,'booted':False,'error':str(e)}
              outcomes.append(row)
              print('NATIVE',json.dumps(row),flush=True)
              if ssx.stem in ('08-chomper-tape', '11-defend-tape') and not (
                      row.get('booted') and row.get('foreground_started')
                      and row.get('bitmap_nonempty')):
                  errors.append('computed BASIC jump native launch regression: '+ssx.stem)
              if ssx.stem == '23-biorhythms-text' and not (
                      row.get('booted') and row.get('foreground_started')
                      and row.get('bitmap_nonempty')):
                  errors.append('Biorhythms native launch regression')
          (out/f'rbc-runtime-shard-{shard}.json').write_text(json.dumps(outcomes,indent=2)+chr(10))
          result_path=out/f'rbc-60-results-shard-{shard}.json'
          if result_path.exists():
              rows=json.loads(result_path.read_text())
              by_name={item['program']:item for item in rows}
              for row in outcomes:
                  if row['program'] in by_name:
                      by_name[row['program']]['native_result']=row
              result_path.write_text(json.dumps(rows,indent=2)+chr(10))
          if errors:
              sys.exit('; '.join(errors))
          PY
      - name: Verify immediate INKEY$ press, hold, release and no-key
        if: matrix.shard == 0
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/inkey_probe.py \
            --root . --out trial-result/rbc-game-probe
      - name: Capture Galaxians and Invaders native key sequences
        if: always() && (matrix.shard == 2 || matrix.shard == 4)
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/frame_probe.py \
            --root . --trial trial-result
      - name: Check Galaxians ship movement with physical keys
        if: matrix.shard == 2
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/gameplay_ports.py \
            --root . --binary trial-result/25-galaxians-tape.ssx \
            --output trial-result/rbc-movement
      - name: Verify native Galaxians fire laser and score
        if: matrix.shard == 2
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/fire_probe.py \
            --root . --binary trial-result/25-galaxians-tape.ssx \
            --output trial-result/rbc-game-probe
      - name: Verify native HiSoft PAUSE 0 and timed PAUSE
        if: matrix.shard == 2
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/native_pause_probe.py \
            --root . --trial trial-result
      - name: Verify native Invaders INK and PAPER colors
        if: matrix.shard == 4
        run: |
          python3 experiments/hisoft-rbc-2026-10-22/stage/color_probe.py \
            --root . --binary trial-result/58-invaders-tape.ssx \
            --output trial-result/rbc-game-probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rbc-python-source-trial-${{ matrix.shard }}
          path: |
            trial-result/*.json
            trial-result/*.ssx
            trial-result/*.png
            trial-result/rbc-game-probe/*.json
            trial-result/rbc-game-probe/*.png
            trial-result/rbc-movement/*.json
            trial-result/rbc-movement/*.png
            trial-result/rbc-native-pause-controls/*.json
            trial-result/rbc-native-pause-controls/*.png
          retention-days: 1  summarize:
    if: always()
    needs: [prepare, trial]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: rbc-python-source-trial-*
          path: results
      - name: Summarize all compilation attempts
        run: |
          python3 - <<'PY'
          import collections, json, os
          from pathlib import Path
          files=sorted(Path('results').glob('**/rbc-60-results-shard-*.json'))
          rows=[]
          for path in files:
              rows.extend(json.loads(path.read_text()))
          passed=sum(x['ok'] for x in rows)
          failed=len(rows)-passed
          counts=collections.Counter(x['cause_category'] or 'pass' for x in rows)
          text=f"RBC full input results: {passed} passed, {failed} failed, {len(rows)} recorded / 121 expected"
          print(text)
          print('Cause groups:',json.dumps(counts,sort_keys=True))
          summary=os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              Path(summary).write_text('## RBC 121-input summary'+chr(10)+text+chr(10)+
                                       'Cause groups: '+json.dumps(counts,sort_keys=True)+chr(10))
          if len(rows)!=121 or len({x['program'] for x in rows})!=121 or failed:
              raise SystemExit('Full input compilation remains incomplete; inspect saved shard results')
          PY
